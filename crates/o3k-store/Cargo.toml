[package]
name = "o3k-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
md-5.workspace = true
chrono = { workspace = true }
o3k-domain = { path = "../o3k-domain" }
o3k-kernel = { path = "../o3k-kernel" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
rustix = { workspace = true, features = ["fs", "net", "process"] }

[features]
# Test-only crash hooks for deterministic handoff failure injection
# (`O3K_HANDOFF_TEST_EXIT_AFTER_SEND_BEFORE_ACK_READ=1` and
# `O3K_HANDOFF_TEST_EXIT_BEFORE_ACK=1` in `access_lock.rs`). Never enabled in
# release or production builds.
backup-test-hooks = []
