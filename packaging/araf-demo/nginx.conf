# o3k-araf-demo TLS proxy vhosts (rendered verbatim by packaging/o3k-araf-demo.sh).
# Serves the four demo vhosts over HTTPS with the locally minted demo CA.
# Upstream hops to o3kd (api.o3k.demo) and between Araf containers are
# documented local trusted hops; see contracts/araf-compatibility-v1.yaml
# pp3_tuple.known_limitations. No remote-deployment TLS claim.
#
# Upstreams are resolved lazily through the embedded Docker DNS
# (127.0.0.11) so container start order can never wedge the proxy.

server {
    listen 443 ssl;
    server_name tenant.o3k.demo;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    client_max_body_size 25m;
    location / {
        resolver 127.0.0.11 valid=10s;
        set $upstream "http://tenant-console:8080";
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl;
    server_name operator.o3k.demo;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    client_max_body_size 25m;
    location / {
        resolver 127.0.0.11 valid=10s;
        set $upstream "http://operator-console:8080";
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl;
    server_name idp.o3k.demo;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    client_max_body_size 25m;
    # Keycloak 25 serves health on the management interface (port 9000);
    # expose readiness on a dedicated loopback-only path.
    location = /demo-healthz {
        resolver 127.0.0.11 valid=10s;
        set $health_upstream "http://idp:9000";
        # With variables nginx forwards the requested URI; rewrite to the
        # Keycloak management health path.
        rewrite ^ /health/ready break;
        proxy_pass $health_upstream;
        proxy_set_header Host $host;
    }
    # Keycloak emits large authorization responses; give it headroom.
    proxy_buffer_size 128k;
    proxy_buffers 8 128k;
    location / {
        resolver 127.0.0.11 valid=10s;
        set $upstream "http://idp:8080";
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
    }
}

server {
    listen 443 ssl;
    server_name api.o3k.demo;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    client_max_body_size 50m;
    location / {
        # Bridge-reachable loopback relay to the O3K native API bound at
        # 127.0.0.1:18080 (see api-relay.conf); TLS terminates here.
        proxy_pass http://172.17.0.1:18090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
