# o3k-araf-demo API loopback relay (served by the pinned nginx image with
# network_mode: host, rendered verbatim by packaging/o3k-araf-demo.sh).
#
# o3kd's native API is bound to 127.0.0.1:18080 (canonical demo install) and
# cannot be reached from the compose bridge network. This relay binds the
# docker0 address (172.17.0.1, reachable from any container network) and
# forwards to the host loopback API. It listens ONLY on the docker bridge
# address — never on a LAN-facing interface — and terminates no TLS; the
# TLS-terminating vhost remains the tls-proxy api.o3k.demo endpoint.

server {
    listen 172.17.0.1:18090;

    client_max_body_size 50m;
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
