# O3K release channel table — ADVISORY / FUTURE FUNCTIONALITY ONLY.
#
# Channels are NOT part of the trusted installation path. The published
# installer (packaging/get-o3k.sh, exported byte-for-byte as the install.sh
# GitHub Release asset) is pinned to its own release version
# (O3K_INSTALLER_VERSION) and NEVER consults this file or any channel
# service. The optional get.o3k.io Cloudflare Worker
# (packaging/get-o3k-worker/) serves this table for future channel/version
# functionality; production installation goes through the Cloudflare
# redirect rule documented in packaging/get-o3k-worker/cloudflare-redirect.md.
#
# Rules:
#   - a channel maps to an EXACT published release version — never a git
#     branch and never a tag that is not a published release, so a channel can
#     never resolve to main/latest or to unpublished build state;
#   - alpha is a prerelease, so it must not point at GitHub /releases/latest;
#   - `stable` will be added later without redesigning this table.
channels:
  alpha: v0.4.0-rc.4
