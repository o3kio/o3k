name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: o3k
          POSTGRES_PASSWORD: password
          POSTGRES_DB: o3k_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U o3k -d o3k_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      O3K_DATABASE_URL: postgres://o3k:password@127.0.0.1:5432/o3k_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install protobuf compiler and compatibility-test parser
        timeout-minutes: 10
        run: |
          set -euo pipefail
          scripts/ci/apt-provision.sh install \
            protobuf-compiler libvirt-dev pkg-config python3-yaml qemu-utils sqlite3 tgt
      - name: Refresh cached libvirt bindings
        run: cargo clean -p virt-sys
      - name: Format
        run: cargo fmt --all -- --check
      - name: Validate packaging scripts
        run: |
          for file in packaging/*.sh tests/*.sh scripts/*.sh scripts/ci/*.sh; do bash -n "$file"; done
          bash tests/ci-apt-provision.sh
          python3 -m compileall -q scripts
      - name: Test P13.5E deterministic fault proxy and evidence artifact
        run: |
          python3 scripts/p13_5e_fault_proxy.py --self-test
          bash scripts/p13_prepare_toolchain.sh --self-test
          python3 -m json.tool docs/compatibility/p13-5/p13-5e-retry-replay-evidence.json >/dev/null
      - name: Prepare and verify pinned P13 provider toolchain
        id: p13-toolchain
        run: |
          set -euo pipefail
          scripts/ci/apt-provision.sh install unzip
          bash scripts/p13_prepare_toolchain.sh > "$RUNNER_TEMP/p13-toolchain.env"
          sed 's/^export //' "$RUNNER_TEMP/p13-toolchain.env" >> "$GITHUB_ENV"
      - name: Install pinned actionlint
        run: |
          install_dir="${RUNNER_TEMP}/actionlint/bin"
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          mkdir -p "${install_dir}"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz"
          printf '%s  %s\n' \
            '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757' \
            "${archive}" | sha256sum --check --status
          tar --extract --gzip --file "${archive}" --directory "${install_dir}"
          echo "${install_dir}" >> "${GITHUB_PATH}"
      - name: Validate GitHub Actions workflows
        run: bash scripts/validate-workflows.sh actionlint
      - name: Test workflow validation and duplicate-key regression
        run: bash tests/workflow-validation.sh actionlint
      - name: Test protected real-host workflow guards
        run: bash tests/real-host-workflow-guards.sh
      - name: Test protected P15.7 authority preflight
        run: bash tests/p15_7_protected_preflight.sh
      - name: Test protected P15.7 Keycloak authority guards
        run: bash tests/p15_7_keycloak_authority_guards.sh
      - name: Test protected P15.7 journey and diagnostic guards
        run: bash tests/p15_7_scale_composition_guards.sh
      - name: Test protected P15.7 libvirt pool ownership
        run: bash tests/p15_7_libvirt_pool_cleanup.sh
      - name: Test protected P15.7 dispatch guard
        run: bash tests/p15_7_dispatch_guard.sh
      - name: Test protected P15.7 PostgreSQL cleanup ownership
        run: bash tests/p15_7_postgres_cleanup.sh
      - name: Test protected LVM provider workflow guards
        run: bash tests/lvm-provider-workflow-guards.sh
      - name: Test protected LVM real guest workflow guards
        run: bash tests/real-lvm-guest-workflow-guards.sh
      - name: Test real-host leak verifier
        run: bash tests/real-host-leak-verifier.sh
      - name: Test protected real-Cinder workflow guards
        run: bash tests/real-cinder-workflow-guards.sh
      - name: Test real-Cinder evidence artifacts
        run: bash tests/real-cinder-evidence-artifacts.sh
      - name: Test real-Cinder tgt configuration regression
        run: bash tests/real-cinder-tgt-config.sh
      - name: Test real-Cinder attachment diagnostics SQL (attach_status)
        run: bash tests/real-cinder-attach-status-diagnostics.sh
      - name: Test CHAP iSCSI compute gate (Gate D; skips without tgt/iscsiadm/libvirt)
        run: bash tests/cinder-chap-compute-gate.sh
      - name: Test Tempest summary generator
        run: bash tests/tempest-summary-generator.sh
      - name: Test Tempest preflight validation logic (self-test)
        run: bash tests/tempest-preflight-test.sh
      - name: Test Tempest/Cinder venv isolation and Gate B/C verdict independence
        run: bash tests/tempest-runner-isolation.sh
      - name: Test CI workflow contracts
        run: bash tests/ci-workflow.sh
      - name: Test disposable LVM profile guards
        run: bash tests/lvm-testlab-profile.sh
      - name: Test OpenAPI contract governance
        run: bash tests/openapi-governance.sh
      - name: Test native IAM public contract
        run: bash tests/native-iam-contract.sh
      - name: Test P12-IAM.7 real OIDC federation evidence
        run: bash tests/p12-iam-7-real-idp.sh
      - name: Test static compatibility target
        run: bash tests/compatibility-target.sh
      - name: Test requirements-to-evidence traceability
        run: bash tests/traceability.sh
      - name: Test compatibility backlog inventory
        run: bash tests/compatibility-backlog.sh
      - name: Test ADR governance metadata
        run: bash tests/adr-governance.sh
      - name: Test reproducible toolchain evidence
        run: bash tests/toolchain-evidence.sh
      - name: Test real-host capability probe
        run: bash tests/real-host-capability-probe.sh
      - name: Test release evidence gate
        run: bash tests/release-gate.sh
      - name: Test release E2E evidence contract
        run: bash tests/release-e2e-evidence.sh
      - name: Test human review evidence package
        run: bash tests/human-review-package.sh
      - name: Test generated review diff package
        run: bash tests/review-diff-package.sh
      - name: Test candidate evidence manifest
        run: bash tests/release-evidence-manifest.sh
      - name: Test program tracker contract
        run: bash tests/program-tracker.sh
      - name: Test product-profile status governance
        run: bash tests/profile-state.sh
      - name: Test PP.0 frozen profile and release/installer contracts
        run: bash tests/pp0-contracts.sh
      - name: Test capability inventory generation
        run: bash tests/capability-inventory.sh
      - name: Test normative TestLab API baseline
        run: bash tests/testlab-api-baseline.sh
      - name: Test cross-implementation contract harness
        run: bash tests/compatibility-harness.sh
      - name: Test P13.1A provider harness foundation
        run: bash tests/p13_1_provider_harness.sh
      - name: Test OpenStack CLI failure cleanup
        run: bash tests/openstack-cli-cleanup.sh
      - name: Test operational outcomes inventory
        run: bash tests/operational-outcomes.sh
      - name: Test real-libvirt harness contract
        run: bash tests/real-libvirt-harness.sh
      - name: Test packaging safety
        run: bash tests/packaging-safety.sh
      - name: Test packaging SBOM
        run: bash tests/packaging-sbom.sh
      - name: Test release bundle installer
        run: bash tests/packaging-bundle.sh
      - name: Test get.o3k.io worker endpoint
        run: node --test packaging/get-o3k-worker/test.mjs
      - name: Check get.o3k.io worker assets are in sync
        run: bash packaging/get-o3k-worker/sync.sh --check
      - name: Test packaging account-reuse refusal
        run: bash tests/packaging-account-refusal.sh
      - name: Test release bundle integrity
        run: bash tests/release-bundle-integrity.sh
      - name: Test o3k doctor process-level contract
        run: bash tests/doctor-process.sh
      - name: Test o3k upgrade/rollback process-level contract
        run: bash tests/upgrade-process.sh
      - name: Test Helm chart lint and template validation
        run: bash tests/helm-lint-and-template.sh
      - name: Test Kubernetes deployment version consistency
        run: bash tests/kubernetes-version-consistency.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Architecture boundary check
        run: python3 scripts/check-architecture-boundaries.py
      - name: Maintainability architecture guardrails
        run: |
          python3 scripts/check-maintainability-guards.py
          bash tests/maintainability-guards.sh
      - name: Install pinned cargo-nextest
        run: cargo install cargo-nextest --version 0.9.131 --locked
      - name: Test governed nextest PR profile
        run: cargo nextest run --workspace --all-features --profile pr
      - name: Upload nextest JUnit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nextest-junit
          if-no-files-found: warn
          path: target/nextest/pr/junit.xml
      - name: Test
        run: cargo test --workspace --all-features
      - name: P12.4 PostgreSQL conformance (mandatory)
        run: cargo test -p o3k-store --test postgres_p12_4 --all-features -- --ignored --nocapture
      - name: Emit exact-source binary build manifest (preparation for artifact pipeline)
        # Safest useful preparation for the follow-up pre-built-artifact pipeline:
        # record the exact commit and sha256 of the two protected-run binaries so
        # the follow-up can compare a protected-run build against ordinary CI. This
        # does NOT change the trust model: the protected runner still verifies its
        # own build against the exact source until the accepted follow-up decides
        # otherwise. See issue #502 for the full design.
        run: |
          mkdir -p target/ci-artifacts
          cargo build --bin o3kd --locked
          cargo build --bin o3k-compute-bin --features libvirt --locked
          python3 scripts/emit-build-manifest.py target/ci-artifacts/build-manifest.json "${GITHUB_SHA}"
      - name: Validate committed PostgreSQL P13.5F provider parity evidence
        # The hosted Rust runner has no disposable LVM TestLab.  Provider
        # execution evidence is produced by the accepted PostgreSQL/TestLab
        # tiers; this job must validate the exact committed artifact instead
        # of starting an impossible full 11-gate baseline locally.
        run: >-
          python3 scripts/validate_p13_5f_postgres_provider_parity.py
          docs/compatibility/p13-5/postgres-provider-parity/p13-5f-postgres-provider-parity.json
      - name: Validate P13.6A security/failure contract and harness skeleton
        # Requires the built o3kd binary (self-test boots a two-project o3kd).
        env:
          O3K_P13_EVIDENCE_DIR: ${{ runner.temp }}/p13-6a-evidence
        run: |
          mkdir -p "$O3K_P13_EVIDENCE_DIR"
          python3 scripts/validate_p13_6a_contract.py
          python3 scripts/validate_p13_6_evidence.py --self-test
          python3 -m json.tool docs/compatibility/p13-6/p13-6a-security-failure-contract.json >/dev/null
          P13_6_SELF_TEST=1 bash tests/p13_6_multiproject_security.sh
      - name: Upload P13.6A evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p13-6a-contract-evidence
          if-no-files-found: warn
          path: ${{ runner.temp }}/p13-6a-evidence
      - name: Run P13.5E real upstream provider fault-proxy gate
        # Keep this gate bounded so a hosted-runner fault cannot hide its result.
        env:
          O3K_P13_EVIDENCE_DIR: ${{ runner.temp }}/p13-5e-evidence
        run: |
          mkdir -p "$O3K_P13_EVIDENCE_DIR"
          timeout --foreground 10m bash tests/p13_5e_real_provider_fault_proxy.sh
      - name: Upload P13.5E fault-proxy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p13-5e-real-provider-evidence
          if-no-files-found: warn
          path: ${{ runner.temp }}/p13-5e-evidence
      - name: Upload exact-source build manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exact-source-build-manifest
          if-no-files-found: warn
          path: target/ci-artifacts/build-manifest.json
      - name: Validate compute-agent protobuf draft
        run: |
          protoc --proto_path=proto \
            --descriptor_set_out=/tmp/o3k-compute-agent-v1.pb \
            proto/compute/v1/compute_agent.proto
      - name: Install buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: 1.50.0
          github_token: ${{ github.token }}
      - name: Fetch protobuf compatibility baseline
        run: git fetch origin main:refs/remotes/origin/main
      - name: Check protobuf compatibility
        run: buf breaking --against '.git#branch=origin/main,subdir=proto'
      - name: TestLab fake-provider workflow
        run: bash tests/testlab.sh
      - name: Test measurement authentication input
        run: bash tests/measure-auth.sh
      - name: Test measurement process ownership
        run: bash tests/measure-process-ownership.sh
      - name: Generate candidate SBOM
        run: bash packaging/make-sbom.sh target/testlab-artifacts/sbom.spdx.json
      - name: Generate TestLab artifact checksums
        run: |
          (cd target/testlab-artifacts && sha256sum result.json sbom.spdx.json > SHA256SUMS)
      - name: Upload TestLab artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testlab-artifacts
          if-no-files-found: warn
          path: |
            target/testlab-artifacts/result.json
            target/testlab-artifacts/sbom.spdx.json
            target/testlab-artifacts/SHA256SUMS
  # ISSUE #907 integrated production-profile northbound convergence gate. The
  # orchestrator provisions a disposable PostgreSQL 16.4, reuses the pinned
  # Keycloak fixture via tests/p12-iam-7-real-idp.sh's AFTER_HOOK, and runs the
  # real o3kd convergence gate against both PostgreSQL and SQLite. It needs
  # docker (disposable containers) and protoc (o3kd build dependency).
  araf-p2-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action; reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install build prerequisites
        timeout-minutes: 10
        run: scripts/ci/apt-provision.sh install protobuf-compiler pkg-config python3-yaml sqlite3
      - name: Run ISSUE #907 Araf P2 northbound convergence gate (PostgreSQL + SQLite)
        run: bash tests/araf-p2-convergence.sh
  # The installer negative matrix SKIPs itself on any host that is not
  # Ubuntu 24.04/Debian 12 (it would become a vacuous pass on a newer
  # ubuntu-latest). Pin it to ubuntu-24.04 explicitly so the matrix stays
  # meaningful when ubuntu-latest moves forward.
  installer-negative:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test one-line installer negative matrix
        run: sudo bash tests/installer-negative.sh
      - name: Test PP.2 canonical-bootstrap installer contract
        run: bash tests/pp2-installer-contract.sh
      - name: Test PP.3 Araf demo tuple/deployment contract
        run: bash tests/pp3-araf-demo-contract.sh
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
      - name: Validate advisory exception policy
        run: bash tests/supply-chain-governance.sh
      - name: Audit Rust dependencies for vulnerabilities
        run: |
          advisory_db="${RUNNER_TEMP}/rustsec-advisory-db"
          advisory_commit="84dd82689f285460d9b815c8e3271b33780f411e"
          git init "${advisory_db}"
          git -C "${advisory_db}" remote add origin https://github.com/RustSec/advisory-db.git
          git -C "${advisory_db}" fetch --depth=1 origin "${advisory_commit}"
          git -C "${advisory_db}" checkout --detach "${advisory_commit}"
          test "$(git -C "${advisory_db}" rev-parse HEAD)" = "${advisory_commit}"
          echo "RustSec advisory database: ${advisory_commit}"
          cargo install cargo-audit --version 0.22.1 --locked
          cargo audit --db "${advisory_db}" --no-fetch --stale --ignore RUSTSEC-2023-0071
  tempest-preflight:
    name: Tempest portable preflight (Gate A)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install python venv tooling
        run: |
          set -euo pipefail
          scripts/ci/apt-provision.sh install python3-venv python3-pip
      - name: Run deterministic Tempest preflight
        env:
          O3K_PREFLIGHT_RESULT: target/tempest-preflight/result.json
        run: bash tests/tempest-preflight.sh
      - name: Upload Tempest preflight result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tempest-preflight-result
          if-no-files-found: warn
          path: |
            target/tempest-preflight/result.json
