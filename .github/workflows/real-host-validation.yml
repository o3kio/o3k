name: Real-host validation

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Full 40-character commit SHA to validate (defaults to main)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: o3k-real-host-validation
  cancel-in-progress: false

jobs:
  real-host:
    name: Protected TestLab real-host validation
    if: >-
      github.repository == 'o3kio/o3k' &&
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || inputs.target_sha != '')
    env:
      TARGET_SHA: ${{ inputs.target_sha || github.sha }}
    timeout-minutes: 120
    # Configure this environment to require maintainer approval.
    environment: o3k-real-host-validation
    runs-on: [self-hosted, linux, x64, kvm, libvirt, o3k-testlab]
    steps:
      - name: Repair prior protected artifact ownership
        run: |
          set -euo pipefail
          for artifact_dir in \
            "${GITHUB_WORKSPACE}/target/real-host-workflow-artifacts" \
            "${GITHUB_WORKSPACE}/target/lvm-real-guest-artifacts" \
            "${GITHUB_WORKSPACE}/target/debug"; do
            if test -e "${artifact_dir}"; then
              sudo -n chown -R "$(id -u):$(id -g)" "${artifact_dir}"
            fi
          done

      - name: Check out the canonical repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned; reads rust-toolchain.toml

      - name: Verify immutable source checkout
        env:
          GITHUB_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "${TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          git cat-file -e "${TARGET_SHA}^{commit}"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          mkdir -p target
          printf 'tested_source_sha=%s\n' "${TARGET_SHA}" > target/tested-source-sha.txt

      - name: Protected P15.7 authority and capacity preflight
        id: protected_preflight
        continue-on-error: true
        env:
          O3K_REAL_HOST_ARTIFACT_DIR: target/real-host-workflow-artifacts
          O3K_P15_7_SOURCE_SHA: ${{ inputs.target_sha || github.sha }}
          O3K_P15_7_JOURNEY_SCRIPT: ${{ github.workspace }}/scripts/p15-7-real-host-journey.sh
          O3K_P15_7_AUTHORITY_MODE: testlab-keycloak
          O3K_P15_7_KEYCLOAK_AUTHORITY_SCRIPT: ${{ github.workspace }}/scripts/p15-7-keycloak-authority.sh
          # Optional external-oidc certification interface (unused by the
          # default self-contained TestLab authority).
          # O3K_P15_7_OPERATOR_EXCHANGE_COMMAND:
          # O3K_P15_7_OIDC_ISSUER:
          # O3K_P15_7_OIDC_AUDIENCE:
          # O3K_P15_7_OIDC_DISCOVERY_URL:
        run: bash scripts/p15-7-protected-preflight.sh

      - name: Enforce protected preflight boundary
        if: always()
        run: test "${{ steps.protected_preflight.outcome }}" = success

      - name: Allocate run-scoped TestLab ports
        run: |
          set -euo pipefail
          # Keep all disposable endpoints isolated from stale or ambient host
          # services while retaining the bootstrap script's fail-closed port
          # ownership checks.
          offset=$((GITHUB_RUN_ID % 1000))
          {
            # Keep the protected run range separate from the historical
            # 18080/18551/19100 defaults, which may remain occupied by an
            # interrupted pre-scoping run on the shared runner.
            printf 'O3K_TESTLAB_PORT=%s\n' "$((28080 + offset))"
            printf 'O3K_TESTLAB_CONTROL_PORT=%s\n' "$((28551 + offset))"
            printf 'O3K_TESTLAB_COMPUTE_HEALTH_PORT=%s\n' "$((29100 + offset))"
          } >> "$GITHUB_ENV"

      - name: Bootstrap disposable TestLab
        id: bootstrap
        if: steps.protected_preflight.outcome == 'success'
        continue-on-error: true
        env:
          O3K_REAL_HOST_ARTIFACT_DIR: target/real-host-workflow-artifacts
          O3K_PROVIDER: agent
          # The storage-phase bootstrap is intentionally SQLite.  Do not let
          # a runner-level URL from an earlier job point this fresh state at a
          # stale or unavailable PostgreSQL instance; the generic/P15.7 phase
          # provisions and exports its own PostgreSQL URL below.
          O3K_DATABASE_BACKEND: sqlite
          O3K_DATABASE_URL: ""
          # Scoped info filters keep protected evidence readable without
          # logging payloads; secrets remain excluded by the redacted fields.
          O3K_LOG_FILTER: debug
          O3K_COMPUTE_LOG_FILTER: debug
          O3K_AGENT_INSPECT_PROBE_ENABLED: true
          O3K_AGENT_INSPECT_PROBE_RESOURCE_FILE: ${{ github.workspace }}/target/real-host-workflow-artifacts/agent-inspect-resource-id
        run: bash scripts/bootstrap-disposable-testlab.sh

      - name: Download and verify CirrOS image
        id: image
        if: steps.bootstrap.outcome == 'success'
        continue-on-error: true
        env:
          CIRROS_IMAGE_URL: https://download.cirros-cloud.net/0.6.3/cirros-0.6.3-x86_64-disk.img
          CIRROS_IMAGE_SHA256: 7d6355852aeb6dbcd191bcda7cd74f1536cfe5cbf8a10495a7283a8396e4b75b
        run: |
          image_path="$(mktemp "${RUNNER_TEMP}/cirros-0.6.3-x86_64-disk.img.XXXXXX")"
          printf 'o3k-disposable-image-v1\nrun=%s\n' "${GITHUB_RUN_ID}" > "${image_path}.o3k-owned"
          chmod 0600 "${image_path}.o3k-owned"
          printf 'O3K_TESTLAB_IMAGE_PATH=%s\n' "${image_path}" >> "${GITHUB_ENV}"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
            --proto '=https' --tlsv1.2 \
            --output "${image_path}" "${CIRROS_IMAGE_URL}"
          printf '%s  %s\n' "${CIRROS_IMAGE_SHA256}" "${image_path}" \
            | sha256sum --check --strict --status
          chmod 0644 "${image_path}"

      - name: Probe runner capabilities
        id: capabilities
        if: steps.bootstrap.outcome == 'success' && steps.image.outcome == 'success'
        continue-on-error: true
        env:
          O3K_REAL_HOST_ARTIFACT_DIR: target/real-host-workflow-artifacts
          O3K_REAL_HOST_RUNNER_LABELS: self-hosted,linux,x64,kvm,libvirt,o3k-testlab
          O3K_REAL_HOST_WORKFLOW_RUN_ID: ${{ github.run_id }}
          O3K_REAL_HOST_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          O3K_REAL_HOST_RUNNER_NAME: ${{ runner.name }}
          GITHUB_SHA: ${{ inputs.target_sha || github.sha }}
        run: bash scripts/real-host-capability-probe.sh

      - name: Install pinned P13.4 provider tools and build runtime
        id: storage_tools
        if: steps.bootstrap.outcome == 'success' && steps.image.outcome == 'success' && steps.capabilities.outcome == 'success'
        run: |
          set -euo pipefail
          if ! command -v unzip >/dev/null 2>&1; then
            scripts/ci/apt-provision.sh install unzip
          fi
          command -v unzip >/dev/null 2>&1
          tool_dir="${RUNNER_TEMP}/o3k-p13-provider-tools-${GITHUB_RUN_ID}"
          mkdir -p "${tool_dir}"
          bash scripts/p13_2_provider_tools.sh "${tool_dir}" >"${tool_dir}/env"
          # The bootstrap emits shell-compatible `export NAME=value` lines
          # for local eval. GitHub's environment file accepts only the
          # assignment form, so strip the shell keyword at this boundary.
          sed 's/^export //' "${tool_dir}/env" >>"${GITHUB_ENV}"
          # The bootstrap script verifies the pinned release archives before
          # exposing either executable. Keep this explicit at the protected
          # boundary so the evidence cannot be produced by an unpinned tool.
          eval "$(cat "${tool_dir}/env")"
          test "$("${O3K_P13_TOFU}" version | head -n 1)" = "OpenTofu v1.12.6"
          test "$(sha256sum "${O3K_P13_PROVIDER_BINARY}" | awk '{print $1}')" = \
            "2840ef5e25598f85591cf984825a8a19b9de498782cfe253e6d3e78740fbd5dc"
          cargo build --locked --bin o3kd

      - name: Pre-run host and trust guard
        id: guard
        if: always() && steps.protected_preflight.outcome == 'success'
        env:
          O3K_REAL_HOST_ARTIFACT_DIR: target/real-host-workflow-artifacts
          O3K_REAL_HOST_OPENSTACK_INVENTORY: true
          O3K_REAL_HOST_CAPABILITY_OUTPUT: target/real-host-workflow-artifacts/runner-capabilities.json
          O3K_REAL_HOST_WORKFLOW_RUN_ID: ${{ github.run_id }}
          O3K_REAL_HOST_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ inputs.target_sha || github.sha }}
          O3K_REAL_HOST_TARGET_SHA: ${{ inputs.target_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/real-host-pre-run-guard.sh

      - name: Provision disposable tagged P13.4 LVM profile
        id: storage_lvm
        if: steps.protected_preflight.outcome == 'success' && steps.guard.outputs.ready == 'true'
        env:
          O3K_LVM_RUN_ID: ${{ github.run_id }}
          O3K_LVM_STATE_BASE: /var/lib/o3k-lvm-testlab
          O3K_LVM_PROVIDER_NAMESPACE: testlab-${{ github.run_id }}
          O3K_LVM_VG_NAME: o3k-lvm-${{ github.run_id }}
          O3K_LVM_THIN_POOL: o3k-thin-${{ github.run_id }}
        run: >-
          sudo -n
          --preserve-env=O3K_LVM_RUN_ID,O3K_LVM_STATE_BASE,O3K_LVM_PROVIDER_NAMESPACE,O3K_LVM_VG_NAME,O3K_LVM_THIN_POOL
          env O3K_LVM_VG_NAME="${O3K_LVM_VG_NAME}"
          O3K_LVM_THIN_POOL="${O3K_LVM_THIN_POOL}"
          bash scripts/lvm-testlab-profile.sh provision

      - name: Run P13.4 native Volume provider gate
        id: storage_volume
        if: steps.storage_lvm.outcome == 'success'
        env:
          O3K_P13_4_DISCOVERY_TRACE: target/real-host-workflow-artifacts/p13-4-volume-trace.jsonl
          O3K_LVM_VOLUME_GROUP: o3k-lvm-${{ github.run_id }}
          O3K_LVM_THIN_POOL: o3k-thin-${{ github.run_id }}
          O3K_LVM_PROVIDER_NAMESPACE: testlab-${{ github.run_id }}
        run: >-
          sudo -n
          --preserve-env=PATH,CARGO_HOME,GITHUB_WORKSPACE,O3K_P13_TOFU,O3K_P13_PROVIDER_BINARY,O3K_P13_PASSWORD,O3K_P13_4_DISCOVERY_TRACE,O3K_LVM_VOLUME_GROUP,O3K_LVM_THIN_POOL,O3K_LVM_PROVIDER_NAMESPACE
          env O3K_LVM_VOLUME_GROUP="${O3K_LVM_VOLUME_GROUP}"
          O3K_LVM_THIN_POOL="${O3K_LVM_THIN_POOL}"
          O3K_LVM_PROVIDER_NAMESPACE="${O3K_LVM_PROVIDER_NAMESPACE}"
          bash tests/p13_4_provider_volume_smoke.sh

      - name: Run P13.4 VolumeAttachment provider gate
        id: storage_attachment
        if: steps.storage_lvm.outcome == 'success'
        env:
          O3K_LVM_VOLUME_GROUP: o3k-lvm-${{ github.run_id }}
          O3K_LVM_THIN_POOL: o3k-thin-${{ github.run_id }}
          O3K_LVM_PROVIDER_NAMESPACE: testlab-${{ github.run_id }}
        run: >-
          sudo -n
          --preserve-env=PATH,CARGO_HOME,GITHUB_WORKSPACE,O3K_P13_TOFU,O3K_P13_PROVIDER_BINARY,O3K_P13_PASSWORD,O3K_LVM_VOLUME_GROUP,O3K_LVM_THIN_POOL,O3K_LVM_PROVIDER_NAMESPACE
          env O3K_LVM_VOLUME_GROUP="${O3K_LVM_VOLUME_GROUP}"
          O3K_LVM_THIN_POOL="${O3K_LVM_THIN_POOL}"
          O3K_LVM_PROVIDER_NAMESPACE="${O3K_LVM_PROVIDER_NAMESPACE}"
          bash tests/p13_4_provider_volume_attachment_smoke.sh

      - name: Run P13.4 storage recovery and fencing tests
        id: storage_recovery
        if: steps.storage_lvm.outcome == 'success'
        run: cargo test --locked -p o3k-reconciler --all-features -- storage --test-threads=1

      - name: Start disposable P13.4 PostgreSQL
        id: storage_postgres_bootstrap
        if: steps.storage_lvm.outcome == 'success'
        run: |
          set -euo pipefail
          container="o3k-p13-4-postgres-${GITHUB_RUN_ID}"
          port=15432
          # Keep the disposable database endpoint run-scoped, but do not let a
          # stale owned container from an earlier failed run block new evidence.
          # We only select an unbound loopback port; cleanup still requires the
          # exact container id and O3K ownership ledger below.
          available=0
          for _ in $(seq 1 128); do
            if python3 -c 'import socket,sys; probe=socket.socket(socket.AF_INET,socket.SOCK_STREAM); probe.bind(("127.0.0.1",int(sys.argv[1]))); probe.close()' "${port}" 2>/dev/null
            then
              available=1
              break
            fi
            port=$((port + 1))
          done
          if ((available != 1)); then
            echo "no available loopback port for disposable PostgreSQL" >&2
            exit 1
          fi
          if sudo -n docker inspect "${container}" >/dev/null 2>&1; then
            echo "refusing to reuse pre-existing PostgreSQL container ${container}" >&2
            exit 1
          fi
          sudo -n docker run --detach --rm --name "${container}" \
            --label o3k.owner=o3k \
            --label "o3k.run_id=${GITHUB_RUN_ID}" \
            --label o3k.phase=p13-4 \
            --label "o3k.source_sha=${TARGET_SHA}" \
            --publish "127.0.0.1:${port}:5432" \
            --env POSTGRES_USER=o3k \
            --env POSTGRES_PASSWORD=p13-4-disposable-postgres \
            --env POSTGRES_DB=o3k_test \
            postgres:16.4 >/dev/null
          for _ in $(seq 1 60); do
            if sudo -n docker exec "${container}" pg_isready -U o3k -d o3k_test >/dev/null 2>&1; then
              python3 - "${container}" "${GITHUB_RUN_ID}" "${TARGET_SHA}" > target/real-host-workflow-artifacts/p13-4-postgres-ownership.json <<'PY'
          import json, subprocess, sys
          name, run_id, sha = sys.argv[1:]
          cid = subprocess.check_output(["sudo", "-n", "docker", "inspect", "-f", "{{.Id}}", name], text=True).strip()
          json.dump({"artifact_type":"o3k-postgres-ownership","schema_version":1,
                     "phase":"p13-4","container_id":cid,"run_id":run_id,
                     "source_sha":sha,"owner":"o3k","redacted":True}, sys.stdout)
          PY
              chmod 0644 target/real-host-workflow-artifacts/p13-4-postgres-ownership.json
              printf 'O3K_DATABASE_URL=postgres://o3k:p13-4-disposable-postgres@127.0.0.1:%s/o3k_test\n' "${port}" >>"${GITHUB_ENV}"
              printf 'O3K_P13_4_PG_CONTAINER=%s\n' "${container}" >>"${GITHUB_ENV}"
              exit 0
            fi
            sleep 1
          done
          echo "disposable PostgreSQL did not become ready" >&2
          exit 1

      - name: Run P13.4 PostgreSQL storage conformance
        id: storage_postgres
        if: steps.storage_postgres_bootstrap.outcome == 'success'
        env:
          O3K_DATABASE_BACKEND: postgres
        run: cargo test --locked -p o3k-store --test postgres_p13_4_storage --all-features -- --ignored --nocapture

      - name: Prepare P13.4 disposable guest inputs
        id: storage_guest_inputs
        if: steps.storage_lvm.outcome == 'success'
        env:
          CIRROS_IMAGE_URL: https://download.cirros-cloud.net/0.6.3/cirros-0.6.3-x86_64-disk.img
          CIRROS_IMAGE_SHA256: 7d6355852aeb6dbcd191bcda7cd74f1536cfe5cbf8a10495a7283a8396e4b75b
        run: |
          set -euo pipefail
          slug="$(printf '%s' "${GITHUB_RUN_ID}" | tr -cd '[:alnum:]' | head -c 16)"
          image="${RUNNER_TEMP}/o3k-p13-4-cirros-${slug}.img"
          key="${RUNNER_TEMP}/o3k-p13-4-guest-${slug}.key"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
            --proto '=https' --tlsv1.2 --output "${image}" "${CIRROS_IMAGE_URL}"
          printf '%s  %s\n' "${CIRROS_IMAGE_SHA256}" "${image}" \
            | sha256sum --check --strict --status
          ssh-keygen -q -t ed25519 -N '' -f "${key}"
          chmod 0644 "${image}"
          chmod 0600 "${key}"
          {
            printf 'O3K_LVM_GUEST_IMAGE_PATH=%s\n' "${image}"
            printf 'O3K_LVM_GUEST_SSH_PRIVATE_KEY=%s\n' "${key}"
            printf 'O3K_LVM_GUEST_SSH_USER=cirros\n'
          } >>"${GITHUB_ENV}"

      - name: Run P13.4 real LVM/libvirt guest gate
        id: storage_guest
        if: steps.storage_guest_inputs.outcome == 'success'
        env:
          O3K_LVM_RUN_ID: ${{ github.run_id }}
          O3K_LVM_STATE_BASE: /var/lib/o3k-lvm-testlab
          O3K_LVM_VOLUME_GROUP: o3k-lvm-${{ github.run_id }}
          O3K_LVM_THIN_POOL: o3k-thin-${{ github.run_id }}
          O3K_LVM_PROVIDER_NAMESPACE: testlab-${{ github.run_id }}
        run: >-
          sudo -n
          --preserve-env=PATH,CARGO_HOME,GITHUB_WORKSPACE,GITHUB_RUN_ID,O3K_LVM_RUN_ID,O3K_LVM_STATE_BASE,O3K_LVM_VOLUME_GROUP,O3K_LVM_THIN_POOL,O3K_LVM_PROVIDER_NAMESPACE,O3K_LVM_GUEST_IMAGE_PATH,O3K_LVM_GUEST_SSH_PRIVATE_KEY,O3K_LVM_GUEST_SSH_USER
          bash scripts/real-lvm-guest-gate.sh

      - name: Verify all P13.4 protected storage gates ran
        if: always()
        env:
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          TOOLS_OUTCOME: ${{ steps.storage_tools.outcome }}
          LVM_OUTCOME: ${{ steps.storage_lvm.outcome }}
          VOLUME_OUTCOME: ${{ steps.storage_volume.outcome }}
          ATTACHMENT_OUTCOME: ${{ steps.storage_attachment.outcome }}
          RECOVERY_OUTCOME: ${{ steps.storage_recovery.outcome }}
          POSTGRES_OUTCOME: ${{ steps.storage_postgres.outcome }}
          GUEST_OUTCOME: ${{ steps.storage_guest.outcome }}
        run: |
          set -euo pipefail
          test "${GUARD_OUTCOME}" = success
          for outcome in "${TOOLS_OUTCOME}" "${LVM_OUTCOME}" "${VOLUME_OUTCOME}" \
            "${ATTACHMENT_OUTCOME}" "${RECOVERY_OUTCOME}" "${POSTGRES_OUTCOME}" \
            "${GUEST_OUTCOME}"; do
            test "${outcome}" = success
          done

      - name: Write redacted P13.4 protected storage evidence
        if: always()
        env:
          SOURCE_SHA: ${{ inputs.target_sha || github.sha }}
          VOLUME_OUTCOME: ${{ steps.storage_volume.outcome || 'skipped' }}
          ATTACHMENT_OUTCOME: ${{ steps.storage_attachment.outcome || 'skipped' }}
          RECOVERY_OUTCOME: ${{ steps.storage_recovery.outcome || 'skipped' }}
          POSTGRES_OUTCOME: ${{ steps.storage_postgres.outcome || 'skipped' }}
          GUEST_OUTCOME: ${{ steps.storage_guest.outcome || 'skipped' }}
        run: |
          set -euo pipefail
          mkdir -p target/real-host-workflow-artifacts
          python3 - target/real-host-workflow-artifacts/p13-4-storage-evidence.json <<'PY'
          import json, os, pathlib, sys
          value = {
              "artifact_type": "p13-4-protected-storage-evidence",
              "schema_version": 1,
              "redacted": True,
              "tested_source_sha": os.environ["SOURCE_SHA"],
              "opentofu": "1.12.6",
              "provider": "terraform-provider-openstack/openstack 3.4.0",
              "provider_sha256": "2840ef5e25598f85591cf984825a8a19b9de498782cfe253e6d3e78740fbd5dc",
              "provider_modified": False,
              "volume_gate": os.environ["VOLUME_OUTCOME"],
              "volume_attachment_gate": os.environ["ATTACHMENT_OUTCOME"],
              "storage_recovery_fencing": os.environ["RECOVERY_OUTCOME"],
              "postgresql": os.environ["POSTGRES_OUTCOME"],
              "real_lvm_libvirt_guest": os.environ["GUEST_OUTCOME"],
              "leak_check": "covered-by-real-host-post-run-guard",
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Stop disposable P13.4 PostgreSQL
        if: always()
        run: |
          set -euo pipefail
          TARGET_SHA="${TARGET_SHA}" bash scripts/cleanup-owned-postgres.sh p13-4 "${GITHUB_RUN_ID}" target/real-host-workflow-artifacts/p13-4-postgres-ownership.json

      - name: Clean up P13.4 real guest resources
        if: always()
        env:
          O3K_LVM_RUN_ID: ${{ github.run_id }}
          O3K_LVM_STATE_BASE: /var/lib/o3k-lvm-testlab
        run: sudo -n --preserve-env=GITHUB_WORKSPACE,GITHUB_RUN_ID,O3K_LVM_RUN_ID,O3K_LVM_STATE_BASE bash scripts/real-lvm-guest-gate.sh cleanup

      - name: Tear down disposable P13.4 LVM profile
        if: always()
        env:
          O3K_LVM_RUN_ID: ${{ github.run_id }}
          O3K_LVM_STATE_BASE: /var/lib/o3k-lvm-testlab
          O3K_LVM_PROVIDER_NAMESPACE: testlab-${{ github.run_id }}
        run: sudo -n --preserve-env=O3K_LVM_RUN_ID,O3K_LVM_STATE_BASE,O3K_LVM_PROVIDER_NAMESPACE bash scripts/lvm-testlab-profile.sh cleanup

      - name: Remove P13.4 disposable guest inputs
        if: always()
        run: |
          set -euo pipefail
          slug="$(printf '%s' "${GITHUB_RUN_ID}" | tr -cd '[:alnum:]' | head -c 16)"
          rm -f -- "${RUNNER_TEMP}/o3k-p13-4-cirros-${slug}.img" \
            "${RUNNER_TEMP}/o3k-p13-4-guest-${slug}.key" \
            "${RUNNER_TEMP}/o3k-p13-4-guest-${slug}.key.pub"

      - name: Stop storage-phase disposable TestLab
        if: always() && steps.guard.outputs.ready == 'true'
        run: bash scripts/cleanup-disposable-testlab.sh

      - name: Start disposable generic-phase PostgreSQL
        id: generic_postgres_bootstrap
        if: steps.protected_preflight.outcome == 'success' && steps.guard.outputs.ready == 'true'
        run: |
          set -euo pipefail
          container="o3k-p15-7-postgres-${GITHUB_RUN_ID}"
          port=15433
          available=0
          for _ in $(seq 1 128); do
            if python3 -c 'import socket,sys; probe=socket.socket(socket.AF_INET,socket.SOCK_STREAM); probe.bind(("127.0.0.1",int(sys.argv[1]))); probe.close()' "${port}" 2>/dev/null
            then
              available=1
              break
            fi
            port=$((port + 1))
          done
          if ((available != 1)); then
            echo "no available loopback port for generic-phase PostgreSQL" >&2
            exit 1
          fi
          if sudo -n docker inspect "${container}" >/dev/null 2>&1; then
            echo "refusing to reuse pre-existing PostgreSQL container ${container}" >&2
            exit 1
          fi
          sudo -n docker run --detach --rm --name "${container}" \
            --label o3k.owner=o3k \
            --label "o3k.run_id=${GITHUB_RUN_ID}" \
            --label o3k.phase=p15-7 \
            --label "o3k.source_sha=${TARGET_SHA}" \
            --publish "127.0.0.1:${port}:5432" \
            --env POSTGRES_USER=o3k \
            --env POSTGRES_PASSWORD=p15-7-disposable-postgres \
            --env POSTGRES_DB=o3k_test \
            postgres:16.4 >/dev/null
          for _ in $(seq 1 60); do
            if sudo -n docker exec "${container}" pg_isready -U o3k -d o3k_test >/dev/null 2>&1; then
              python3 - "${container}" "${GITHUB_RUN_ID}" "${TARGET_SHA}" > target/real-host-workflow-artifacts/p15-7-postgres-ownership.json <<'PY'
          import json, subprocess, sys
          name, run_id, sha = sys.argv[1:]
          cid = subprocess.check_output(["sudo", "-n", "docker", "inspect", "-f", "{{.Id}}", name], text=True).strip()
          json.dump({"artifact_type":"o3k-postgres-ownership","schema_version":1,
                     "phase":"p15-7","container_id":cid,"run_id":run_id,
                     "source_sha":sha,"owner":"o3k","redacted":True}, sys.stdout)
          PY
              chmod 0644 target/real-host-workflow-artifacts/p15-7-postgres-ownership.json
              {
                printf 'O3K_DATABASE_BACKEND=postgres\n'
                printf 'O3K_DATABASE_URL=postgres://o3k:p15-7-disposable-postgres@127.0.0.1:%s/o3k_test\n' "${port}"
                printf 'O3K_P15_7_PG_CONTAINER=%s\n' "${container}"
              } >>"${GITHUB_ENV}"
              exit 0
            fi
            sleep 1
          done
          echo "generic-phase PostgreSQL did not become ready" >&2
          exit 1

      - name: Prepare fresh generic TestLab image
        id: generic_image
        if: steps.protected_preflight.outcome == 'success' && steps.guard.outputs.ready == 'true'
        continue-on-error: true
        env:
          CIRROS_IMAGE_URL: https://download.cirros-cloud.net/0.6.3/cirros-0.6.3-x86_64-disk.img
          CIRROS_IMAGE_SHA256: 7d6355852aeb6dbcd191bcda7cd74f1536cfe5cbf8a10495a7283a8396e4b75b
        run: |
          set -euo pipefail
          image_path="$(mktemp "${RUNNER_TEMP}/cirros-0.6.3-x86_64-disk.img.generic.XXXXXX")"
          printf 'o3k-disposable-image-v1\nrun=%s\nphase=generic\n' "${GITHUB_RUN_ID}" > "${image_path}.o3k-owned"
          chmod 0600 "${image_path}.o3k-owned"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
            --proto '=https' --tlsv1.2 \
            --output "${image_path}" "${CIRROS_IMAGE_URL}"
          printf '%s  %s\n' "${CIRROS_IMAGE_SHA256}" "${image_path}" \
            | sha256sum --check --strict --status
          chmod 0644 "${image_path}"
          printf 'O3K_TESTLAB_IMAGE_PATH=%s\n' "${image_path}" >> "${GITHUB_ENV}"

      - name: Prepare P15.7 foreign-project fixture credentials
        if: steps.protected_preflight.outcome == 'success' && steps.generic_postgres_bootstrap.outcome == 'success' && steps.generic_image.outcome == 'success'
        run: bash scripts/prepare-p15-7-foreign-project-fixture.sh

      - name: Bootstrap fresh generic TestLab
        id: generic_bootstrap
        if: steps.protected_preflight.outcome == 'success' && steps.guard.outputs.ready == 'true' && steps.generic_image.outcome == 'success'
        continue-on-error: true
        env:
          O3K_REAL_HOST_ARTIFACT_DIR: target/real-host-workflow-artifacts
          O3K_PROVIDER: agent
          O3K_LOG_FILTER: debug
          O3K_COMPUTE_LOG_FILTER: debug
          # P15.7 uses independently provisioned libvirt VMs as genuine
          # prepared hosts. Their identities are generated by the canonical
          # bootstrap and authorized through the same mTLS boundary.
          O3K_TESTLAB_ADDITIONAL_AGENT_IDS: block-a,block-b,block-c,block-d
          O3K_TESTLAB_CONTROL_BIND_ADDR: 0.0.0.0
          O3K_AGENT_INSPECT_PROBE_ENABLED: true
          O3K_AGENT_INSPECT_PROBE_RESOURCE_FILE: ${{ github.workspace }}/target/real-host-workflow-artifacts/agent-inspect-resource-id
        run: bash scripts/bootstrap-disposable-testlab.sh

      - name: Verify fresh generic TestLab capabilities
        id: generic_capabilities
        if: steps.generic_bootstrap.outcome == 'success'
        continue-on-error: true
        env:
          O3K_REAL_HOST_ARTIFACT_DIR: target/real-host-workflow-artifacts
          O3K_REAL_HOST_RUNNER_LABELS: self-hosted,linux,x64,kvm,libvirt,o3k-testlab
          O3K_REAL_HOST_WORKFLOW_RUN_ID: ${{ github.run_id }}
          O3K_REAL_HOST_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          O3K_REAL_HOST_RUNNER_NAME: ${{ runner.name }}
          GITHUB_SHA: ${{ inputs.target_sha || github.sha }}
        run: bash scripts/real-host-capability-probe.sh

      - name: Fresh generic TestLab pre-run guard
        id: generic_guard
        if: always() && steps.protected_preflight.outcome == 'success'
        env:
          O3K_REAL_HOST_ARTIFACT_DIR: target/real-host-workflow-artifacts
          O3K_REAL_HOST_OPENSTACK_INVENTORY: true
          O3K_REAL_HOST_CAPABILITY_OUTPUT: target/real-host-workflow-artifacts/runner-capabilities.json
          O3K_REAL_HOST_WORKFLOW_RUN_ID: ${{ github.run_id }}
          O3K_REAL_HOST_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ inputs.target_sha || github.sha }}
          O3K_REAL_HOST_TARGET_SHA: ${{ inputs.target_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/real-host-pre-run-guard.sh

      - name: Run public real-host lifecycle
        id: lifecycle
        if: steps.protected_preflight.outcome == 'success' && steps.generic_guard.outputs.ready == 'true'
        continue-on-error: true
        env:
          O3K_REAL_HOST_ARTIFACT_DIR: target/real-host-workflow-artifacts
          O3K_REAL_HOST_OPENSTACK_INVENTORY: true
          O3K_REAL_HOST_CAPABILITY_OUTPUT: target/real-host-workflow-artifacts/runner-capabilities.json
          O3K_TESTLAB_ARTIFACT_DIR: target/real-host-workflow-artifacts
          O3K_TESTLAB_CONFIG_DRIVE: true
          O3K_TESTLAB_CONSOLE_ATTEMPTS: 12
          # Keep the client watchdog outside the API's 15-second agent
          # dispatch budget so the API can return a terminal error response.
          O3K_TESTLAB_CONSOLE_REQUEST_TIMEOUT_SECONDS: 25
          O3K_AGENT_INSPECT_PROBE_RESOURCE_FILE: ${{ github.workspace }}/target/real-host-workflow-artifacts/agent-inspect-resource-id
          O3K_AGENT_INSPECT_PROBE_OUTPUT: /var/lib/o3k-testlab/${{ github.run_id }}/agent-inspect-probe.json
        run: bash tests/testlab-libvirt.sh

      - name: Run compute-agent mTLS command evidence
        id: agent_mtls
        if: steps.protected_preflight.outcome == 'success' && steps.generic_guard.outputs.ready == 'true'
        continue-on-error: true
        env:
          O3K_REAL_HOST_ARTIFACT_DIR: target/real-host-workflow-artifacts
        run: bash tests/real-compute-agent-mtls.sh

      - name: Run compute-agent process-boundary evidence
        id: agent_process
        if: steps.protected_preflight.outcome == 'success' && steps.generic_guard.outputs.ready == 'true'
        continue-on-error: true
        env:
          O3K_REAL_HOST_ARTIFACT_DIR: target/real-host-workflow-artifacts
        run: bash tests/real-compute-agent-process-mtls.sh

      - name: Prepare pinned P15.7 VM host image
        id: p15_7_host_image
        if: steps.protected_preflight.outcome == 'success' && steps.generic_guard.outputs.ready == 'true'
        continue-on-error: true
        env:
          P15_7_HOST_IMAGE_URL: https://cloud-images.ubuntu.com/releases/releases/noble/release-20260911/ubuntu-24.04-server-cloudimg-amd64.img
          P15_7_HOST_IMAGE_SHA256: 612b2c0cc1bc413a6cb8c38fd611794caf0f2b436c50013d8b3794db12ad7354
        run: |
          set -euo pipefail
          image_path="${RUNNER_TEMP}/o3k-p15-7-ubuntu-24.04-${GITHUB_RUN_ID}.img"
          test ! -e "${image_path}" && test ! -e "${image_path}.o3k-owned"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 900 \
            --proto '=https' --tlsv1.2 --output "${image_path}" "${P15_7_HOST_IMAGE_URL}"
          printf '%s  %s\n' "${P15_7_HOST_IMAGE_SHA256}" "${image_path}" \
            | sha256sum --check --strict --status
          printf 'o3k-p15-7-host-image-v1\nrun=%s\nsha256=%s\n' \
            "${GITHUB_RUN_ID}" "${P15_7_HOST_IMAGE_SHA256}" >"${image_path}.o3k-owned"
          chmod 0644 "${image_path}"
          chmod 0600 "${image_path}.o3k-owned"
          {
            printf 'O3K_P15_7_HOST_IMAGE_PATH=%s\n' "${image_path}"
            printf 'O3K_P15_7_HOST_IMAGE_SHA256=%s\n' "${P15_7_HOST_IMAGE_SHA256}"
          } >>"${GITHUB_ENV}"

      - name: Run P15.7 scale/composition convergence gate
        id: p15_7
        if: steps.protected_preflight.outcome == 'success' && steps.generic_guard.outputs.ready == 'true' && steps.p15_7_host_image.outcome == 'success'
        env:
          O3K_REAL_HOST_ARTIFACT_DIR: target/real-host-workflow-artifacts
          O3K_P15_7_REAL_HOST: "1"
          O3K_P15_7_SOURCE_SHA: ${{ inputs.target_sha || github.sha }}
          O3K_P15_7_PROFILE: small-edge-cloud
          O3K_PROVIDER: agent
          O3K_P15_7_OPERATOR_TOKEN_FILE: ${{ runner.temp }}/o3k-p15-7-operator-${{ github.run_id }}.token
          # The early preflight launches the self-contained authority.  The
          # journey performs the short-lived canonical federation exchange
          # immediately before privileged work; no bearer token is placed in
          # workflow YAML, argv, logs, or evidence.
          # The repository-owned journey is the default.  A separately
          # configured command may still be supplied for external certification
          # profiles, but no GitHub variable is required for testlab-keycloak.
          O3K_P15_7_JOURNEY_COMMAND: ${{ vars.O3K_P15_7_JOURNEY_COMMAND || 'bash scripts/p15-7-real-host-journey.sh' }}
        run: bash tests/p15_7_scale_composition.sh

      - name: Extract redacted create diagnostics
        if: always() && steps.protected_preflight.outcome == 'success'
        run: |
          output=target/real-host-workflow-artifacts/create-diagnostics.log
          state_root="/var/lib/o3k-testlab/${GITHUB_RUN_ID}"
          {
            printf 'artifact_type=protected-create-diagnostics\n'
            printf 'source_commit=%s\n' "${TARGET_SHA}"
            if sudo -n test -d "${state_root}/log"; then
              sudo -n sh -c \
                'grep -hE "server create reconciliation|artifact transfer|create reconciliation|agent create|create (request|command|artifact)|create artifacts" "$1"/log/*.log 2>/dev/null || true' \
                _ "${state_root}"
            else
              printf 'state_logs=unavailable\n'
            fi
          } >"${output}"
          chmod 0644 "${output}"

      - name: Capture redacted console boundary diagnostics
        if: always() && steps.protected_preflight.outcome == 'success'
        run: |
          output=target/real-host-workflow-artifacts/console-boundary-diagnostics.log
          state_root="/var/lib/o3k-testlab/${GITHUB_RUN_ID}"
          {
            printf 'artifact_type=protected-console-boundary-diagnostics\n'
            printf 'source_commit=%s\n' "${TARGET_SHA}"
            printf '== console path metadata (no content) ==\n'
            if sudo -n test -d "${state_root}"; then
              sudo -n stat -c '%n %U:%G:%a' \
                "${state_root}" "${state_root}/data" "${state_root}/data/console" 2>/dev/null || true
              sudo -n find "${state_root}/data" -maxdepth 5 -path '*/console/*' \
                -printf '%p %u:%g:%m %s bytes\n' 2>/dev/null || true
            else
              printf 'state_root=absent\n'
            fi
            printf '== qemu processes (owner only, no arguments) ==\n'
            qemu_pids=$(pgrep -i qemu 2>/dev/null || true)
            if [ -n "${qemu_pids}" ]; then
              ps -o user=,group=,comm= -p "$(printf '%s' "${qemu_pids}" | tr '\n' ',')" 2>/dev/null || true
            else
              printf 'qemu=none\n'
            fi
            printf '== o3kd console boundary log lines ==\n'
            if sudo -n test -f "${state_root}/log/o3kd.log"; then
              sudo -n grep -aE 'console dispatch|agent console|agent observation|command dispatch|command observation|persisted console|control connection|compute agent' \
                "${state_root}/log/o3kd.log" 2>/dev/null | tail -n 200 || true
            else
              printf 'o3kd_log=unavailable\n'
            fi
            printf '== o3k-compute console boundary log lines ==\n'
            if sudo -n test -f "${state_root}/log/o3k-compute.log"; then
              sudo -n grep -aE 'console inspect|console read|read_console|command accepted|command execution|command observation|durable console|control connection' \
                "${state_root}/log/o3k-compute.log" 2>/dev/null | tail -n 200 || true
            else
              printf 'o3k_compute_log=unavailable\n'
            fi
            printf '== daemon WARN/ERROR log lines ==\n'
            if sudo -n test -d "${state_root}/log"; then
              sudo -n sh -c 'grep -ahE '"'"'"level":"(WARN|ERROR)"'"'"' "$1"/log/*.log 2>/dev/null | tail -n 100 || true' _ "${state_root}"
            fi
          } >"${output}"
          chmod 0644 "${output}"

      - name: Stop and remove disposable TestLab
        if: always()
        run: bash scripts/cleanup-disposable-testlab.sh

      - name: Stop generic-phase PostgreSQL
        if: always()
        run: |
          set -euo pipefail
          TARGET_SHA="${TARGET_SHA}" bash scripts/cleanup-owned-postgres.sh p15-7 "${GITHUB_RUN_ID}" target/real-host-workflow-artifacts/p15-7-postgres-ownership.json

      - name: Remove protected operator authority file
        if: always()
        run: |
          set -euo pipefail
          token_file="${RUNNER_TEMP}/o3k-p15-7-operator-${GITHUB_RUN_ID}.token"
          marker="${token_file}.o3k-owned"
          if [[ -e "${token_file}" || -e "${marker}" ]]; then
            test -f "${marker}" && ! test -L "${marker}"
            grep -Fqx 'o3k-p15-7-operator-token-v1' "${marker}"
            grep -Fqx "run=${GITHUB_RUN_ID}" "${marker}"
            test -f "${token_file}" && ! test -L "${token_file}"
            test "$(stat -c '%a' "${token_file}")" = 600
            if command -v shred >/dev/null 2>&1; then
              shred --remove --zero --force -- "${token_file}" || rm -f -- "${token_file}"
            else
              rm -f -- "${token_file}"
            fi
            rm -f -- "${marker}"
          fi

      - name: Remove owned P15.7 Keycloak authority
        if: always()
        env:
          O3K_P15_7_AUTHORITY_MODE: testlab-keycloak
          O3K_P15_7_KEYCLOAK_AUTHORITY_SCRIPT: ${{ github.workspace }}/scripts/p15-7-keycloak-authority.sh
          O3K_P15_7_KEYCLOAK_STATE_ROOT: ${{ runner.temp }}/o3k-p15-7-keycloak-${{ github.run_id }}
          O3K_P15_7_SOURCE_SHA: ${{ inputs.target_sha || github.sha }}
        run: bash scripts/p15-7-keycloak-authority.sh cleanup

      - name: Remove owned P15.7 VM host image
        if: always()
        run: |
          set -euo pipefail
          image_path="${RUNNER_TEMP}/o3k-p15-7-ubuntu-24.04-${GITHUB_RUN_ID}.img"
          marker="${image_path}.o3k-owned"
          if [[ -e "${image_path}" || -e "${marker}" ]]; then
            test -f "${marker}"
            grep -Fqx "o3k-p15-7-host-image-v1" "${marker}"
            grep -Fqx "run=${GITHUB_RUN_ID}" "${marker}"
            grep -Fqx "sha256=612b2c0cc1bc413a6cb8c38fd611794caf0f2b436c50013d8b3794db12ad7354" "${marker}"
            rm -f -- "${image_path}" "${marker}"
          fi

      # The post-run guard snapshots the host AFTER every cleanup step so the
      # after-inventory describes the same stable lifecycle point as the
      # pre-run baseline. Running it earlier recorded the run's own in-flight
      # disposable PostgreSQL container's random docker veth pair as foreign
      # state and falsely failed the foreign-state comparison.
      - name: Post-run result guard
        if: always() && steps.protected_preflight.outcome == 'success'
        env:
          O3K_REAL_HOST_ARTIFACT_DIR: target/real-host-workflow-artifacts
          O3K_REAL_HOST_OPENSTACK_INVENTORY: true
          O3K_REAL_HOST_WORKFLOW_STEP_STATUS: ${{ steps.lifecycle.outcome || 'skipped' }}
          O3K_REAL_HOST_P15_7_STEP_STATUS: ${{ steps.p15_7.outcome || 'skipped' }}
        run: bash scripts/real-host-post-run-guard.sh

      - name: Upload redacted real-host artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-host-workflow-artifacts
          path: |
            target/real-host-workflow-artifacts/runner-capabilities.json
            target/real-host-workflow-artifacts/disposable-testlab-bootstrap.json
            target/real-host-workflow-artifacts/disposable-testlab-startup-diagnostics.log
            target/real-host-workflow-artifacts/real-host-owned-inventory-baseline.json
            target/real-host-workflow-artifacts/real-host-owned-inventory-after.json
            target/real-host-workflow-artifacts/real-host-workflow-result.json
            target/real-host-workflow-artifacts/resource-leak-result.json
            target/real-host-workflow-artifacts/libvirt-result.json
            target/real-host-workflow-artifacts/openstack-cli-result.json
            target/real-host-workflow-artifacts/console-result.json
            target/real-host-workflow-artifacts/console-file-size-evidence.txt
            target/real-host-workflow-artifacts/console-error.log
            target/real-host-workflow-artifacts/server-show-evidence.json
            target/real-host-workflow-artifacts/server-list-evidence.json
            target/real-host-workflow-artifacts/compute-agent-mtls-result.json
            target/real-host-workflow-artifacts/compute-agent-process-mtls-result.json
            target/real-host-workflow-artifacts/p15-7-scale-composition-evidence.json
            target/real-host-workflow-artifacts/p15-7-gate-result.json
            target/real-host-workflow-artifacts/p15-7-provisioning-diagnostics.json
            target/real-host-workflow-artifacts/p15-7-protected-preflight.json
            target/real-host-workflow-artifacts/p15-7-postgres-ownership.json
            target/real-host-workflow-artifacts/p13-4-postgres-ownership.json
            target/real-host-workflow-artifacts/p13-4-volume-trace.jsonl
            target/real-host-workflow-artifacts/p13-4-storage-evidence.json
            target/lvm-real-guest-artifacts/lvm-real-guest-result.json
            target/real-host-workflow-artifacts/agent-inspect-resource-id
            target/real-host-workflow-artifacts/create-diagnostics.log
            target/real-host-workflow-artifacts/console-boundary-diagnostics.log
            target/tested-source-sha.txt
          if-no-files-found: warn
          retention-days: 14
