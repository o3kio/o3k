name: Temporary P15.7 protected dispatcher

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "PP.5 protected acceptance lane"
        required: true
        type: choice
        options:
          - s1-boundary
          - s2-boundary
          - 1035-crash-recovery
          - s5-scale
          - host-maintenance
          - integrated

permissions:
  contents: read
  actions: write

concurrency:
  group: o3k-p15-7-protected-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'o3kio/o3k'
    runs-on: ubuntu-latest
    steps:
      - name: Check out dispatcher guard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Dispatch exact merged source to protected TestLab
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          PP5_LANE: ${{ inputs.lane }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "${TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "${GITHUB_REF}" == refs/heads/* ]]
          case "${PP5_LANE}" in
            integrated|s1-boundary|s2-boundary|s5-scale|1035-crash-recovery|host-maintenance) ;;
            *) echo "unsupported PP.5 lane: ${PP5_LANE}" >&2; exit 2 ;;
          esac
          bash scripts/p15-7-protected-dispatch-guard.sh "${TARGET_SHA}"
          gh api --method POST \
            "repos/o3kio/o3k/actions/workflows/p15-7-protected-preflight.yml/dispatches" \
            -f "ref=${WORKFLOW_REF}" \
            -f "inputs[target_sha]=${TARGET_SHA}" \
            -f "inputs[lane]=${PP5_LANE}"
