name: Temporary P15.7 protected dispatcher

on:
  push:
    branches:
      - main
    paths:
      - scripts/bootstrap-disposable-testlab.sh
      - tests/disposable-testlab-bootstrap.sh
      - .github/workflows/p15-7-protected-dispatch.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: github.repository == 'o3kio/o3k'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact merged source to protected TestLab
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "${TARGET_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          gh api --method POST \
            "repos/o3kio/o3k/actions/workflows/real-host-validation.yml/dispatches" \
            -f ref=main \
            -f "inputs[target_sha]=${TARGET_SHA}"
