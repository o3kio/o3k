name: Promote qualified O3K Early Access release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft Early Access tag to promote after exact-artifact qualification
        required: true
        type: choice
        options:
          - v0.4.1

permissions:
  contents: read

concurrency:
  group: o3k-ea-promotion-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.repository == 'o3kio/o3k' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      issues: read
    steps:
      - name: Checkout immutable release tag for verification tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@828df1e55de306ba29db814d6057ddae71883cda # pinned action
        with:
          cosign-release: v3.1.3

      - name: Verify and promote the exact staged artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          O3K_EA_OWNER_GO: ${{ vars.O3K_EA_OWNER_GO }}
        run: packaging/promote-ea-release.sh "$TAG"
