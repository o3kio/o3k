name: PP.6 certification closure guard

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  require-final-acceptance:
    if: >-
      github.event.issue.number == 975 &&
      github.event.issue.state_reason != 'not_planned' &&
      !contains(github.event.issue.labels.*.name, 'pp6-final-go')
    runs-on: ubuntu-latest
    steps:
      - name: Reopen PP.6 certification closure without final acceptance label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          issue_api="repos/${GH_REPOSITORY}/issues/${ISSUE_NUMBER}"
          gh api --method PATCH "$issue_api" --field state=open >/dev/null
          gh api --method POST "${issue_api}/comments" \
            --field body="Reopened automatically by the PP.6 certification closure guard. Closing #975 as completed still requires final PP.6 acceptance: owner GO, linked operational/release evidence, zero actionable BLOCKER/HIGH/MEDIUM findings, and the pp6-final-go label. ADR-0191-governed supersession with GitHub state reason not_planned is exempt; it does not certify PP.6 or change evidence status." \
            >/dev/null
