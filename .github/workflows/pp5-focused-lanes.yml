name: PP.5 focused lanes

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Focused acceptance lane"
        required: true
        type: choice
        options:
          - s5-scale
          - 1035-crash-recovery
          - host-maintenance
      target_sha:
        description: "Exact commit under test"
        required: true
        type: string

permissions:
  contents: read

jobs:
  focused:
    runs-on: [self-hosted, linux, x64, kvm, libvirt, o3k-testlab]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
      - name: Run focused S5 scale lifecycle
        if: inputs.lane == 's5-scale'
        env:
          O3K_P15_7_REAL_HOST: "1"
          O3K_P15_7_SOURCE_SHA: ${{ inputs.target_sha }}
          O3K_PROVIDER: agent
          O3K_REAL_HOST_ARTIFACT_DIR: target/real-host-workflow-artifacts
        run: bash tests/pp5_s5_scale.sh
      - name: Run focused #1035 crash/orphan recovery
        if: inputs.lane == '1035-crash-recovery'
        env:
          O3K_P15_7_REAL_HOST: "1"
          O3K_P15_7_SOURCE_SHA: ${{ inputs.target_sha }}
          O3K_PROVIDER: agent
          O3K_REAL_HOST_ARTIFACT_DIR: target/real-host-workflow-artifacts
          O3K_P15_7_1035_JOURNEY_COMMAND: ${{ vars.O3K_P15_7_1035_JOURNEY_COMMAND }}
        run: bash tests/pp5_1035_crash_recovery.sh
      - name: Run focused host maintenance
        if: inputs.lane == 'host-maintenance'
        env:
          O3K_P15_7_REAL_HOST: "1"
          O3K_P15_7_SOURCE_SHA: ${{ inputs.target_sha }}
          O3K_PROVIDER: agent
          O3K_REAL_HOST_ARTIFACT_DIR: target/real-host-workflow-artifacts
          O3K_P15_7_MAINTENANCE_JOURNEY_COMMAND: ${{ vars.O3K_P15_7_MAINTENANCE_JOURNEY_COMMAND }}
        run: bash tests/pp5_host_maintenance.sh
      - name: Upload focused phase artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pp5-focused-${{ inputs.lane }}
          path: target/real-host-workflow-artifacts/*
          if-no-files-found: warn
