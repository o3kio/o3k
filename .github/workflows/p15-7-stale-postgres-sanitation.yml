name: P15.7 stale postgres sanitation (one-time, runner-2404)

# Bounded ONE-TIME sanitation of the 5 stale OWNED O3K disposable PostgreSQL
# containers observed on runner-2404 (inspection runs 35342436821 /
# 35345964079). Each is proven owned by live docker labels (o3k.owner,
# o3k.run_id, o3k.phase, o3k.source_sha) AND by a terminal owning GitHub run
# whose head_sha matches the container's source_sha label. Anything failing
# any check is preserved and reported. Never touches foreign containers.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type SANITIZE-STALE-POSTGRES to confirm this one-time bounded run"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sanitize:
    name: One-time stale owned postgres sanitation
    if: >-
      github.repository == 'o3kio/o3k' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm == 'SANITIZE-STALE-POSTGRES'
    runs-on: [self-hosted, linux, x64, kvm, libvirt, o3k-testlab]
    timeout-minutes: 15
    steps:
      # No repository checkout: the protected run may leave root-owned
      # artifacts in the workspace that checkout cannot remove. The bounded
      # script is fetched verbatim at the exact merged SHA instead.
      - name: Fetch pinned sanitation script
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 \
            "https://raw.githubusercontent.com/o3kio/o3k/${GITHUB_SHA}/scripts/p15-7-stale-postgres-sanitation.sh" \
            -o "$RUNNER_TEMP/p15-7-stale-postgres-sanitation.sh"
          chmod 0755 "$RUNNER_TEMP/p15-7-stale-postgres-sanitation.sh"
          grep -q "stale owned postgres sanitation completed" "$RUNNER_TEMP/p15-7-stale-postgres-sanitation.sh"

      - name: Verify runner identity before any mutation
        run: |
          set -euo pipefail
          host="$(hostname)"
          runner="${RUNNER_NAME:-unknown}"
          echo "hostname=$host runner.name=$runner"
          [[ "$host" == "runner-2404" && "$runner" == "runner-2404" ]] \
            || { echo "refusing to sanitize on unexpected host" >&2; exit 1; }

      - name: Write bounded allowlist
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/stale-postgres.allowlist" <<'EOF'
          # Captured from read-only inspection 35345964079 (2026-09-18).
          # All five containers are `Up 2 days` residue of terminal
          # P15.7/P13.4 runs whose cleanup never executed.
          o3k-p15-7-postgres-35051581115 p15-7 35051581115
          o3k-p15-7-postgres-35050356040 p15-7 35050356040
          o3k-p13-4-postgres-35046228363 p13-4 35046228363
          o3k-p13-4-postgres-35044032378 p13-4 35044032378
          o3k-p13-4-postgres-35039463162 p13-4 35039463162
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/stale-postgres.allowlist"
          cat "$RUNNER_TEMP/stale-postgres.allowlist"

      - name: Run bounded stale postgres sanitation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/p15-7-stale-postgres-sanitation.sh" "$RUNNER_TEMP/stale-postgres.allowlist" \
            | tee "$RUNNER_TEMP/sanitation.log"

      - name: Post-sanitation verification (read-only)
        run: |
          set -euo pipefail
          {
            echo "date: $(date -Is)"
            echo "hostname: $(hostname)"
            echo "--- remaining o3k postgres containers (must be none of the allowlisted) ---"
            sudo -n docker ps -a --format '{{.Names}}' | grep '^o3k-.*-postgres-' || echo "none"
            echo "--- full link list ---"
            ip -o link show
            echo "--- mem ---"; free -m
          } > "$RUNNER_TEMP/post-sanitation.txt" 2>&1
          ! grep -E '^o3k-(p15-7|p13-4)-postgres-350(39463162|44032378|46228363|50356040|51581115)$' \
            <(sudo -n docker ps -a --format '{{.Names}}')

      - name: Upload sanitation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p15-7-stale-postgres-sanitation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sanitation.log
            ${{ runner.temp }}/post-sanitation.txt
          if-no-files-found: error
