    - project
    - service-catalog
  glance:
    - image-list
    - image-show
  neutron:
    - network-list
    - subnet-list
    - port-list
    - network-selection-for-server-create
  nova:
    - flavor-list-or-selected-flavor
    - keypair-where-configured
    - server-list
    - server-show
    - server-create
    - supported-lifecycle-action
    - server-delete
  excluded_services:
    - octavia
    - manila
    - swift
    - heat
    - magnum
    - designate
    - arbitrary-admin-panels
configuration_allowed:
  - keystone-endpoint
  - service-catalog
  - region
  - tls-ca-trust
  - session-settings
  - enabled-panels-for-advertised-services
campaign_matrix:
  ubuntu-24.04-x86_64:
    horizon: required-full-witness
    openstack_cli: required
  debian-12-x86_64:
    horizon: optional-repeat
