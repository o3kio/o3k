# How to read this file
# ---------------------
# One record per product profile (SPEC-0024 and
# compatibility/product-profiles.yaml). Evidence is profile-scoped: an entry
# proven under one profile is never evidence for another. In particular,
# external-Cinder/Tempest success under `openstack-service-testbed` does NOT
# satisfy the `native-rust-testlab` alpha gate.
#
# Evidence states: passed | failed | not-executed | not-proven.
# "not-executed" = the gate exists but has not run for this revision;
# "not-proven" = no evidence exists or evidence is deliberately not claimed.
# No vague "done".
#
# scripts/validate-profile-state.py enforces: the profile set matches the
# registry, the per-profile field contract, the evidence vocabulary, native
# alpha isolation (no Cinder/Tempest evidence under native-rust-testlab),
# source-commit resolvability in this repository's git history, and
# consistency with docs/release-tracker.md (native full-profile evidence
# cannot be `passed` and release relevance cannot claim readiness while the
# tracker remains blocked).

