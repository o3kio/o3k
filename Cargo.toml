[workspace]
members = [
    "bins/o3kd",
    "bins/o3k",
    "bins/o3k-compute",
    "bins/o3k-network",
    "crates/o3k-api",
    "crates/o3k-config",
    "crates/o3k-domain",
    "crates/o3k-identity",
    "crates/o3k-image",
    "crates/o3k-native-api",
    "crates/o3k-network",
    "crates/o3k-network-protocol",
    "crates/o3k-provider",
    "crates/o3k-reconciler",
    "crates/o3k-provider-contract",
    "crates/o3k-compute",
    "crates/o3k-cellhv",
    "crates/o3k-cinder",
    "crates/o3k-compute-agent",
    "crates/o3k-libvirt",
    "crates/o3k-config-drive",
    "crates/o3k-placement",
    "crates/o3k-scheduler",
    "crates/o3k-database-example",
    "crates/o3k-dhcp",
    "crates/o3k-console",
    "crates/o3k-store",
    "crates/o3k-kernel",
    "crates/o3k-controller-protocol",
    "crates/o3k-service-sdk",
    "crates/o3k-storage",
    "crates/o3k-migration",
]
resolver = "2"

[workspace.package]
version = "0.4.0-rc.6"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97.1"
repository = "https://github.com/o3kio/o3k"

[workspace.dependencies]
axum = "0.8"
async-trait = "0.1"
base64 = "0.22"
md-5 = "0.10"
hmac = "0.12"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
http = "1"
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
jsonschema = "0.50"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres", "macros", "migrate", "chrono", "uuid"] }
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
prost = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustix = { version = "0.38", default-features = false, features = ["process", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio-rustls = "0.26"
tonic = { version = "0.13", features = ["transport", "tls-native-roots", "tls-ring"] }
tonic-build = "0.13"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4", "v5", "v7"] }
# Keep the URL/IDNA graph on a patched release.
url = "=2.5.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
