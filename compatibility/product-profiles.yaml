schema_version: 1
status: accepted
normative_spec: docs/specs/SPEC-0024-product-profiles-and-claims.md
product_identity:
  name: O3K Cloud OS
  architecture: cloud-operating-system
  normative_adr: docs/adr/ADR-0165-o3k-cloud-operating-system-and-cloud-kernel.md
  openstack_role: northbound-compatibility-contract
  canonical_internal_platform: o3k-cloud-kernel
profiles:
  - id: p14-openstack-cold-migration-v1
    maturity: specified
    parent_profile: p13-iac-compatibility-v1
    user_outcome: >
      Move the bounded resource set from a declared OpenStack source into
      canonical O3K resources through a durable, resumable, cold migration
      with explicit cutover and rollback semantics.
    o3k_owned_capabilities:
      - iam
      - authorization
      - canonical-resource-authority
      - durable-migration-operations
      - reconciliation
      - cutover-and-audit
    external_hosted_services:
      - declared-openstack-source
    database:
      o3k_default: sqlite
      o3k_production_target: postgres
      source_database_access: forbidden
    release_blocking_for_first_alpha: false
    footprint_claim: unmeasured
    evidence_state: specified
    normative_adr: docs/adr/ADR-0180-openstack-cold-migration-authority-and-cutover.md
    normative_spec: docs/specs/SPEC-0037-openstack-cold-migration-v1.md
    contract: docs/specs/SPEC-0037-openstack-cold-migration-v1.md

  - id: p13-iac-compatibility-v1
    maturity: verified
    parent_profile: native-rust-testlab
    user_outcome: >
      Existing OpenStack Terraform/OpenTofu configurations that use the
      resources listed by this profile and the attribute subsets frozen by the
      applicable provider-contract discovery gate can target O3K through the standard, unmodified
      terraform-provider-openstack provider. All
      resources remain canonical O3K resources; all OpenStack concepts are
      compatibility projections.
    o3k_owned_capabilities:
      - keystone-compatibility
      - image-glance-compatibility
      - compute-nova-compatibility
      - network-neutron-compatibility
      - volume-cinder-compatibility
      - iam
      - canonical-resource-authority
      - durable-operations
      - reconciliation
    external_hosted_services: []
    engines:
      - opentofu v1.12.6 (mandatory)
      - terraform latest (secondary)
    provider:
      upstream: true
      name: terraform-provider-openstack/openstack
      version: 3.4.0
      unmodified: true
    database:
      default: sqlite
      production_target: postgres
    release_blocking_for_first_alpha: false
    footprint_claim: unmeasured
    evidence_state: bounded-p13-7-verified
    normative_adr: docs/adr/ADR-0175-openstack-ecosystem-and-iac-compatibility-boundary.md
    normative_spec: docs/specs/SPEC-0032-openstack-terraform-opentofu-compatibility-profile-v1.md
    contract: contracts/iac-openstack-profile-v1.yaml

  - id: openstack-service-testbed
    maturity: specified
    user_outcome: run a selected real OpenStack service against O3K without a complete DevStack or full OpenStack control plane
    o3k_owned_capabilities:
      - iam
      - keystone-compatibility
      - service-registry
      - token-validation
      - declared-satellite-apis
      - operations-and-reconciliation-as-selected
      - portable-or-real-execution-as-selected
    external_hosted_services:
      - selected-service-under-test
    database:
      o3k_default: sqlite
      o3k_production_target: postgres
      o3k_postgres_support: planned
      external_service_database: owned-by-external-service
    release_blocking_for_first_alpha: false
    footprint_claim: unmeasured
    evidence_state: specified

  - id: native-rust-testlab
    maturity: implemented-partial
    user_outcome: run a declared OpenStack-compatible workflow using O3K-owned Cloud Kernel and Rust service implementations
    o3k_owned_capabilities:
      - iam
      - keystone-compatibility
      - image
      - compute
      - network
      - capacity-placement
      - durable-operations
      - reconciliation
    external_hosted_services: []
    database:
      default: sqlite
      production_target: postgres
      postgres_support: supported-production-backend
    execution_boundaries:
      - o3k-compute
      - o3k-storage
      - embedded-network-provider
    native_volume_profile: implemented-partial
    release_blocking_for_first_alpha: true
    footprint_claim: unmeasured-target-approximately-50mb
    evidence_state: implemented

  - id: small-edge-cloud
    maturity: implemented-partial
    target_hypervisors:
      minimum: 10
      maximum: 20
    user_outcome: operate a lightweight multi-host O3K Cloud OS and integrate only explicitly selected external services or delegated clouds
    o3k_owned_capabilities:
      - cloud-kernel
      - control-plane
      - multi-host-capacity
      - compute-scheduling
      - durable-operations
      - reconciliation
      - declared-network-and-storage-profiles
    external_hosted_services:
      - optional-and-profile-specific
    database:
      default_for_single_controller: sqlite-with-documented-limits
      production_target: postgres
      postgres_support: supported-production-backend
    execution_boundaries:
      - o3k-compute
      - o3k-network
      - o3k-storage
    delegated_cloud_support: requires-separate-profile-and-adr
    release_blocking_for_first_alpha: false
    footprint_claim: unmeasured
    evidence_state: implemented

  # PP.0 (issue #969) frozen product baselines. These two profiles are the
  # contract-frozen answers to "what exactly do we ship"; they derive from
  # native-rust-testlab and small-edge-cloud and add no new authority.
  - id: o3k-demo-v1
    maturity: frozen-contract
    pp_phase: PP.0
    parent_profile: native-rust-testlab
    user_outcome: >
      Single supported Linux x86_64 host running the real native O3K Cloud
      Kernel end to end: canonical o3k init, authenticated local o3k join, one
      local BuildingBlock, real Placement, real topology, real libvirt/KVM
      compute, bounded flat networking, bounded image handling, and native
      ephemeral-root storage, for demo, development, and evaluation.
    supported_targets:
      os: [ubuntu-24.04, debian-12]
      arch: x86_64
      hosts: {target_envelope: single, proven_support_claim: false}
      note: >-
        Build/install target envelope frozen by PP.0, not an OS support claim;
        support claims require PP.2 fresh-install evidence.
    runtime_components:
      - component: o3kd
        required: true
        binary: o3kd
        process_user: o3k
        authority: cloud-kernel-controller
        readiness: /readyz runtime+bootstrap gates
      - component: o3k-cli
        required: true
        binary: o3k
        authority: operator-entrypoint
        readiness: o3k doctor exit 0
      - component: o3k-compute
        required: true
        binary: o3k-compute
        process_user: o3k-compute
        authority: execution-boundary-only
        readiness: /readyz on compute health addr
      - component: o3k-network-agent
        required: false
        binary: o3k-network
        authority: execution-boundary-only
        readiness: >-
          not required or enabled for this profile; shipped inactive in the
          libvirt release bundle since v0.4.0-rc.1 (PP.1, #970) — binary +
          unit installed, never enabled; no readiness requirement
      - component: libvirt-kvm
        required: true
        binary: host-package
        authority: none-o3k
        readiness: qemu:///system capabilities
    database:
      default: sqlite
      production_target: postgres
      postgres_support: optional-not-required-for-demo
    compute_provider: libvirt-kvm-via-o3k-compute-agent
    network_profile: bounded-flat-bridge
    storage_profile: native-ephemeral-root-only
    cloud_profile: required-canonical-p15-4
    building_block: one-local-block-via-canonical-init-join
    interfaces:
      - native-api
      - openstack-compatible-api-baseline
      - o3k-cli
      - araf-client-optional
    araf_integration: client-only-not-required-for-readiness
    araf_demo_tuple:
      state: pending-evidence
      tracking_issue: 973
      contract: contracts/araf-compatibility-v1.yaml
      evidence: >-
        PP.3 fresh-host campaign PASSED on Ubuntu 24.04 x86_64 against the
        published O3K v0.4.0-rc.5 + Araf v1.0.0-rc.12 tuple: real OIDC
        tenant/operator logins, federated native tokens to the real O3K
        native API, production Araf runtime profile (no fixture), restart,
        host reboot, convergent re-run, uninstall/reinstall,
        purge/reinstall, foreign-state preservation, zero secret leakage.
      note: >-
        Araf remains a separately versioned client, is not part of the O3K
        release bundle, and is not required for O3K readiness. Deployment
        mechanism for the demo profile: Docker Engine + Compose v2 via
        packaging/o3k-araf-demo.sh. The one-line installer integration
        shipped in v0.4.0-rc.7 (PP.4, #973) on both frozen demo targets
        (ubuntu-24.04-x86_64, debian-12-x86_64); the FINAL PP.4 campaign
        evidence flip happens separately — this record stays
        pending-evidence until then. No Araf production/HA claim
        (o3kio/araf#106).
    evidence_dependencies:
      - native-rust-testlab
      - p15-7-scale-composition-real-host-gate
    fresh_install_evidence:
      state: passed
      gate: demo-v1-fresh-install-profile-gate
      release: v0.4.0-rc.5
      source_commit: 145b0149fd82f44a4b76f30f7b4fd272ca6ef60d
      campaigns: [ubuntu-24.04, debian-12]
      note: >-
        PP.2 (#971, PR #1025) fresh-host campaigns passed on both frozen
        targets against the exact immutable published release artifact:
        canonical init/join, one ready BuildingBlock, real libvirt VM with
        guest boot proof, reboot/rerun/uninstall/reinstall/purge lifecycle,
        zero duplicate identities, zero foreign-state mutation, zero secret
        leakage. See docs/status/current-state.yaml and
        target/real-host-workflow-artifacts/asr-022-145b0149/.
    known_limitations:
      - not-production
      - not-ha
      - not-multi-node
      - no-live-migration
      - no-automatic-evacuation
      - no-native-persistent-volumes
    release_blocking_for_first_alpha: true
    footprint_claim: unmeasured-target-approximately-50mb
    evidence_state: contract-frozen
    normative_spec: docs/specs/SPEC-0048-pp0-demo-and-small-edge-baseline-freeze.md
    contract: contracts/release-bundle-v1.yaml

  - id: o3k-small-edge-v1
    maturity: frozen-contract
    pp_phase: PP.0
    parent_profile: small-edge-cloud
    user_outcome: >
      One-site near-term production-hardening profile: 1-20 hypervisor target
      envelope, authenticated BuildingBlock lifecycle, durable topology,
      capability-aware Placement, CloudProfile, real compute execution,
      bounded network/storage profiles, PostgreSQL production target, native
      O3K API, and selected OpenStack/Terraform compatibility.
    supported_targets:
      os: [ubuntu-24.04, debian-12]
      arch: x86_64
      hosts: {target_envelope: 1-20, proven_support_claim: false}
      note: >-
        Build/install target envelope frozen by PP.0, not an OS support claim;
        support claims require PP.2 (install) and PP.5 (scale) evidence.
    runtime_components:
      - component: o3kd
        required: true
        binary: o3kd
        process_user: o3k
        authority: cloud-kernel-controller
        readiness: /readyz runtime+bootstrap gates
      - component: o3k-cli
        required: true
        binary: o3k
        authority: operator-entrypoint
        readiness: o3k doctor exit 0
      - component: o3k-compute
        required: true
        binary: o3k-compute
        process_user: o3k-compute
        authority: execution-boundary-only
        readiness: /readyz on compute health addr
      - component: o3k-network-agent
        required: true
        binary: o3k-network
        authority: execution-boundary-only
        readiness: startup reconcile
      - component: libvirt-kvm
        required: true
        binary: host-package
        authority: none-o3k
        readiness: qemu:///system capabilities
    database:
      default: sqlite-with-documented-limits
      production_target: postgres
      postgres_support: supported-production-backend
    compute_provider: libvirt-kvm-via-o3k-compute-agent
    network_profile: bounded-declared-network-profile
    storage_profile: bounded-declared-storage-profile
    cloud_profile: required-canonical-p15-4
    building_block: authenticated-buildingblock-lifecycle-via-canonical-init-join
    interfaces:
      - native-api
      - selected-openstack-compatibility
      - selected-terraform-opentofu-compatibility
      - araf-client-optional
    araf_integration: client-only-not-required-for-readiness
    evidence_dependencies:
      - small-edge-cloud
      - p15-7-multi-building-block-convergence
    known_limitations:
      - no-multi-region
      - no-cells-or-sharding
      - no-arbitrary-datacenter-scale
      - no-automatic-evacuation
      - no-live-migration
      - no-arbitrary-openstack-parity
      - target-1-20-hardening-goal-not-proven-support
    release_blocking_for_first_alpha: false
    footprint_claim: unmeasured
    evidence_state: contract-frozen
    normative_spec: docs/specs/SPEC-0048-pp0-demo-and-small-edge-baseline-freeze.md
    contract: contracts/release-bundle-v1.yaml

claim_rules:
  cloud_operating_system:
    type: architecture-and-product-direction
    implies_production_readiness: false
    implies_full_openstack_parity: false
  approximate_50mb:
    type: target
    requires_profile_specific_measurement: true
    may_be_claimed_as_guarantee: false
  postgres_for_production:
    type: production-profile-backend
    support_status: supported
    tested_version: "PostgreSQL 16"
    may_be_claimed_supported_only_after_adapter_and_conformance: true
  kubernetes_control_plane:
    type: deployment-target
    normative_adr: docs/adr/ADR-0167-kubernetes-native-control-plane-deployment.md
    packaging_target: oci-image-and-helm
    support_status: single-controller-supported
    ha_claim_requires:
      - postgresql-adapter-and-conformance-evidence
      - durable-multi-controller-work-ownership-and-fencing
      - rolling-update-pod-loss-node-drain-and-database-failover-evidence
  openstack_release_compatibility:
    type: operation-level
    blanket_release_parity_forbidden: true
  external_hosted_service:
    must_not_be_claimed_o3k_implemented: true
  delegated_cloud:
    must_not_be_treated_as_execution_provider_without_authority_adr: true
  cross_cloud_interoperation:
    generic_claim_forbidden: true
    requires_explicit_integration_profile: true
  future_native_services:
    architecture_examples_are_not_support_claims: true
