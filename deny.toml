# Dependency policy for cargo-deny.  Keep this file intentionally explicit:
# new registries, git sources, licenses, or advisories must be reviewed.

[advisories]
version = 2
ignore = [
  # Reviewed exception; see docs/supply-chain/advisory-exceptions.yaml. The
  # governance test tests/supply-chain-governance.sh ties this suppression to
  # the locked libsqlite3-sys 0.30.1 graph edge and fails closed on drift.
  { id = "RUSTSEC-2026-0459", reason = "bundled SQLite page-cache disclosure requires a local attacker-placed db/-wal pair; O3K opens only its own store files under root-owned, non-group-writable state/journal directories, and no released SQLx accepts the fixed libsqlite3-sys >= 0.39" },
  # Reviewed exception; see docs/supply-chain/advisory-exceptions.yaml. The
  # governance test tests/supply-chain-governance.sh ties this suppression to
  # the locked chrono 0.4.45 package and fails closed on drift.
  { id = "RUSTSEC-2026-0543", reason = "chrono is flagged unmaintained, not vulnerable; O3K uses it only for UTC timestamps, RFC 3339 formatting/parsing of its own documents, and SQLx date/time mapping, with no untrusted input parsing; no maintained drop-in replacement covers the sqlx 0.8 chrono feature" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "LGPL-2.1",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]
exceptions = [
  { allow = ["LGPL-2.1"], name = "virt" },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Shared Kubedo stretched-L2 fabric provider (ADR-0186 / SPEC-0049),
# consumed by git tag per the fabric repository's change control.
allow-git = ["https://github.com/o3kio/fabric"]
