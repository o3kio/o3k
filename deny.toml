# Dependency policy for cargo-deny.  Keep this file intentionally explicit:
# new registries, git sources, licenses, or advisories must be reviewed.

[advisories]
version = 2
ignore = [
  {
    id = "RUSTSEC-2026-0381",
    reason = "webpki-roots 0.26.11 is the upstream semver shim that re-exports webpki-roots 1.0.10. Cargo.lock resolves its certificate data to fixed webpki-root-certs 1.0.10, which removes the affected root. The advisory range includes the shim version even though its data comes from the fixed package.",
  },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "LGPL-2.1",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]
exceptions = [
  { allow = ["LGPL-2.1"], name = "virt" },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Shared Kubedo stretched-L2 fabric provider (ADR-0186 / SPEC-0049),
# consumed by git tag per the fabric repository's change control.
allow-git = ["https://github.com/o3kio/fabric"]
