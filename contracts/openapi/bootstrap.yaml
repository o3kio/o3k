openapi: 3.1.0
x-o3k-openapi-policy:
  target: "3.1.2"
  status: transitional
x-o3k-baseline:
  path: docs/specs/testlab-api-baseline.json
  status: partial
  coverage: bootstrap
info:
  title: O3K Bootstrap API
  version: 0.2.0-alpha.1
  description: >-
    Bootstrap-only contract. It does not claim complete OpenStack compatibility.
servers:
  - url: http://127.0.0.1:8080
paths:
  /v3/auth/tokens:
    post:
      operationId: issuePasswordScopedToken
      summary: Issue a password token, project-scoped or unscoped
      description: >-
        A request with a project scope returns a project-scoped token. A request
        with no scope member, the "unscoped" keyword, or a scope object without
        a project returns an unscoped token that carries no project, roles, or
        catalog and authorizes no operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '201':
          description: Token issued.
          headers:
            X-Subject-Token:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Unsupported or malformed authentication request.
        '401':
          description: Authentication failed.
        '503':
          description: Bootstrap identity is not configured.
  /v3/auth/projects:
    get:
      operationId: listAuthProjects
      summary: List the projects the authenticated subject may scope into
      description: >-
        Client project discovery used by Horizon's project switcher. Accepts an
        unscoped or project-scoped token and returns only the caller's durable
        role-assignment projects. It is not project administration.
      responses:
        '200':
          description: Caller's role-assignment projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedProjects'
        '401':
          description: Missing, invalid, or expired token.
        '503':
          description: Bootstrap identity is not configured.
  /v3/projects:
    get:
      operationId: listProjects
      summary: List the projects the authenticated subject holds a role assignment on
      description: >-
        Authorization-filtered project listing required by the pinned unmodified
        Horizon 2026.1 client, whose Instances panel resolves each server's
        project name through keystoneclient projects.list. It returns only the
        caller's durable role-assignment projects and is not Keystone project
        administration: there is no admin list-all and no project create,
        update, or delete.
      responses:
        '200':
          description: Caller's role-assignment projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizedProjects'
        '401':
          description: Missing, invalid, or expired token.
        '503':
          description: Bootstrap identity is not configured.
  /healthz:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /readyz:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: Process has completed startup and can accept requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v2/images:
    get:
      operationId: listImages
      responses:
        '200':
          description: Project-scoped image list.
          content:
            application/json:
              schema:
                type: object
                required: [images]
                properties:
                  images:
                    type: array
                    items: {$ref: '#/components/schemas/Image'}
        '401': {description: Authentication required.}
    post:
      operationId: createImage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImageCreate'}
      responses:
        '201':
          description: Queued image metadata created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Image'}
        '400': {description: Invalid image metadata.}
        '401': {description: Authentication required.}
  /v2/images/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: showImage
      responses:
        '200':
          description: Image metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Image'}
        '401': {description: Authentication required.}
        '404': {description: Image not found or inaccessible.}
    delete:
      operationId: deleteImage
      responses:
        '204': {description: Image deleted.}
        '401': {description: Authentication required.}
        '404': {description: Image not found or inaccessible.}
  /v2/images/{id}/file:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: uploadImage
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        '204': {description: Image content stored and activated.}
        '401': {description: Authentication required.}
        '404': {description: Image not found or inaccessible.}
        '409': {description: Active image content is immutable.}
        '413': {description: Upload exceeds the configured limit.}
        '503':
          description: Process is alive but startup or dependency checks are incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v2.0/networks:
    get:
      operationId: listNetworks
      responses: {'200': {description: Project-scoped networks.}}
    post:
      operationId: createNetwork
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses: {'201': {description: Network created.}, '400': {description: Invalid request.}, '401': {description: Unauthorized.}}
  /v2.0/extensions:
    get: {operationId: listNetworkExtensions, responses: {'200': {description: TestLab Neutron extension catalog.}, '401': {description: Authentication required.}}}
  /v2.0/networks/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {operationId: showNetwork, responses: {'200': {description: Network details.}, '404': {description: Not found.}}}
    delete: {operationId: deleteNetwork, responses: {'204': {description: Network deleted.}, '409': {description: Network has dependents.}}}
  /v2.0/subnets:
    get: {operationId: listSubnets, responses: {'200': {description: Project-scoped subnets.}}}
    post: {operationId: createSubnet, requestBody: {required: true, content: {application/json: {schema: {type: object}}}}, responses: {'201': {description: Subnet created.}, '400': {description: Invalid CIDR or pool.}}}
  /v2.0/subnets/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {operationId: showSubnet, responses: {'200': {description: Subnet details.}}}
    delete: {operationId: deleteSubnet, responses: {'204': {description: Subnet deleted.}, '409': {description: Subnet has ports.}}}
  /v2.0/ports:
    get: {operationId: listPorts, responses: {'200': {description: Project-scoped ports.}}}
    post: {operationId: createPort, requestBody: {required: true, content: {application/json: {schema: {type: object}}}}, responses: {'201': {description: Port created.}, '409': {description: Address pool exhausted.}}}
  /v2.0/ports/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {operationId: showPort, responses: {'200': {description: Port details.}}}
    delete: {operationId: deletePort, responses: {'204': {description: Port deleted.}}}
  /v2.1/{project_id}/flavors:
    parameters: [{name: project_id, in: path, required: true, schema: {type: string}}]
    get: {operationId: listFlavors, responses: {'200': {description: Project-scoped TestLab flavor catalog.}, '401': {description: Authentication required.}}}
    post:
      operationId: createFlavor
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FlavorCreate'}
      responses:
        '201':
          description: Project-scoped flavor created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlavorResponse'}
        '400': {description: Invalid flavor request.}
        '401': {description: Authentication required.}
        '409': {description: Flavor name already exists.}
  /v2.1/{project_id}/flavors/{id}:
    parameters: [{name: project_id, in: path, required: true, schema: {type: string}}, {name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {operationId: showFlavor, responses: {'200': {description: Flavor details.}, '404': {description: Flavor not found.}}}
    delete: {operationId: deleteFlavor, responses: {'204': {description: Flavor deleted.}, '401': {description: Authentication required.}, '404': {description: Flavor not found.}, '409': {description: Flavor is still referenced.}}}
  /v2.1/{project_id}/os-keypairs:
    parameters: [{name: project_id, in: path, required: true, schema: {type: string}}]
    get:
      operationId: listKeypairs
      responses: {'200': {description: Project/user-scoped keypairs.}, '401': {description: Authentication required.}}
    post:
      operationId: createKeypair
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/KeypairCreate'}}}}
      responses: {'200': {description: Public keypair imported.}, '400': {description: Invalid public key.}, '409': {description: Duplicate keypair name.}}
  /v2.1/{project_id}/os-keypairs/{name}:
    parameters: [{name: project_id, in: path, required: true, schema: {type: string}}, {name: name, in: path, required: true, schema: {type: string}}]
    get: {operationId: showKeypair, responses: {'200': {description: Keypair details.}, '404': {description: Keypair not found.}}}
    delete: {operationId: deleteKeypair, responses: {'204': {description: Keypair deleted.}, '404': {description: Keypair not found.}, '409': {description: Keypair is attached to a server.}}}
  /v2.1/{project_id}/servers:
    parameters: [{name: project_id, in: path, required: true, schema: {type: string}}]
    get: {operationId: listServers, responses: {'200': {description: Project-scoped server list.}}}
    post: {operationId: createServer, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServerCreate'}}}}, responses: {'202': {description: Server create accepted.}, '400': {description: Invalid request.}, '409': {description: Conflict.}}}
  /v2.1/{project_id}/servers/{id}:
    parameters: [{name: project_id, in: path, required: true, schema: {type: string}}, {name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get: {operationId: showServer, responses: {'200': {description: Server details.}, '404': {description: Server not found.}}}
    delete: {operationId: deleteServer, responses: {'204': {description: Server deleted.}, '409': {description: Invalid server state.}}}
  /v2.1/{project_id}/servers/{id}/action:
    parameters: [{name: project_id, in: path, required: true, schema: {type: string}}, {name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    post: {operationId: serverAction, requestBody: {required: true, content: {application/json: {schema: {type: object}}}}, responses: {'202': {description: Server action accepted.}, '400': {description: Unsupported action.}, '409': {description: Invalid server state.}}}
components:
  schemas:
    TokenRequest:
      type: object
      additionalProperties: false
      required: [auth]
      properties:
        auth:
          type: object
          required: [identity]
          properties:
            identity:
              type: object
              required: [methods, password]
              properties:
                methods:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                    enum: [password]
                password:
                  type: object
                  required: [user]
                  properties:
                    user:
                      type: object
                      required: [password]
                      properties:
                        id: {type: string}
                        name: {type: string}
                        password: {type: string, format: password}
            scope:
              oneOf:
                - type: string
                  enum: [unscoped]
                - type: object
                  required: [project]
                  properties:
                    project:
                      type: object
                      properties:
                        id: {type: string}
                        name: {type: string}
    TokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: object
          required: [expires_at, issued_at, methods, user]
          properties:
            expires_at: {type: string, format: date-time}
            issued_at: {type: string, format: date-time}
            methods:
              type: array
              items: {type: string}
            project: {type: object}
            user: {type: object}
            roles: {type: array, items: {type: object}}
            catalog: {type: array, items: {type: object}}
    AuthorizedProjects:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items:
            type: object
            required: [id, name, domain_id, enabled]
            properties:
              id: {type: string}
              name: {type: string}
              domain_id: {type: string}
              enabled: {type: boolean}
    KeypairCreate:
      type: object
      additionalProperties: false
      required: [keypair]
      properties:
        keypair:
          type: object
          additionalProperties: false
          required: [name, public_key]
          properties:
            name: {type: string, minLength: 1, maxLength: 255}
            public_key: {type: string, minLength: 1}
            type: {type: string, enum: [ssh]}
    FlavorCreate:
      type: object
      additionalProperties: false
      required: [flavor]
      properties:
        flavor:
          type: object
          additionalProperties: false
          required: [name, vcpus, ram, disk]
          properties:
            name: {type: string, minLength: 1, maxLength: 255}
            vcpus: {type: integer, minimum: 1}
            ram: {type: integer, minimum: 1}
            disk: {type: integer, minimum: 0}
    FlavorResponse:
      type: object
      additionalProperties: false
      required: [flavor]
      properties:
        flavor: {$ref: '#/components/schemas/Flavor'}
    Flavor:
      type: object
      additionalProperties: false
      required: [id, name, vcpus, ram, disk]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        vcpus: {type: integer, minimum: 1}
        ram: {type: integer, minimum: 1}
        disk: {type: integer, minimum: 0}
    ServerCreate:
      type: object
      additionalProperties: false
      required: [server]
      properties:
        server:
          type: object
          required: [name, networks]
          anyOf:
            - required: [image]
            - required: [imageRef]
          allOf:
            - anyOf:
                - required: [flavor]
                - required: [flavorRef]
          properties:
            name: {type: string, minLength: 1}
            image: {oneOf: [{type: object}, {type: string}]}
            imageRef: {type: string}
            flavor: {oneOf: [{type: object}, {type: string}]}
            flavorRef: {type: string}
            networks:
              type: array
              minItems: 1
              items:
                type: object
                anyOf:
                  - required: [port]
                  - required: [uuid]
                properties:
                  port: {type: string, format: uuid}
                  uuid: {type: string, format: uuid}
                  fixed_ip: {type: string, format: ipv4}
            key_name: {type: string}
            config_drive: {type: boolean}
    ImageCreate:
      type: object
      additionalProperties: false
      required: [name, container_format, disk_format]
      properties:
        name: {type: string, minLength: 1}
        visibility: {type: string, enum: [private]}
        container_format: {type: string, minLength: 1}
        disk_format: {type: string, minLength: 1}
    Image:
      type: object
      required: [id, name, owner, status, visibility, container_format, disk_format]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        owner: {type: string}
        status: {type: string, enum: [queued, active]}
        visibility: {type: string, enum: [private]}
        container_format: {type: string}
        disk_format: {type: string}
        size: {type: integer, format: int64, nullable: true}
        checksum: {type: string, nullable: true}
    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
