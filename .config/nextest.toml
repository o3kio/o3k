# cargo-nextest 0.9.131 repository configuration.
# Doctests remain in the cargo test lane because nextest does not execute them.
nextest-version = "0.9.131"

[profile.pr]
fail-fast = false
retries = 0
flaky-result = "fail"
slow-timeout = { period = "60s", terminate-after = 2 }
global-timeout = "30m"

[profile.pr.junit]
path = "junit.xml"
report-name = "o3k-nextest-pr"
store-success-output = false
store-failure-output = true

# These tests exercise real qemu-img overlay creation.  Their temporary
# backing-image setup is intentionally isolated from concurrent qemu-img
# invocations; serialise only this pair rather than reducing workspace
# parallelism.
[[profile.pr.overrides]]
filter = 'package(o3k-compute-agent) and test(/committed_raw_image_becomes_owned_overlay_and_deletes_idempotently|distinct_instances_share_base_but_own_independent_overlays/)'
test-group = 'qemu-img'

# The production mTLS recovery cases share the destructive PostgreSQL test
# database and the same durable Realm fixture.  Run that narrow fixture family
# serially so one case cannot truncate another case's lease/work state.
[[profile.pr.overrides]]
filter = 'package(o3kd) and test(/production_mtls_.*/)'
test-group = 'production-mtls-recovery-postgres'

[test-groups.qemu-img]
max-threads = 1

[test-groups.production-mtls-recovery-postgres]
max-threads = 1

[profile.deep]
inherits = "pr"
slow-timeout = { period = "120s", terminate-after = 3 }
global-timeout = "60m"

[profile.deep.junit]
path = "junit.xml"
report-name = "o3k-nextest-deep"
